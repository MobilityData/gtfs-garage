code: fare_transfer_rule_with_forbidden_transfer_count

locators:
  rule: { file: fare_transfer_rules, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `fare_transfer_rules.txt`, what a transfer between two fares costs, is a transfer between two different groups of fares, yet it gives a number of transfers (`transfer_count`). That number is only for transfers within one group."
    actions:
      - { kind: open_rows, at: rule, highlight: [from_leg_group_id, to_leg_group_id, transfer_count] }
      - { kind: show_record, at: rule, fields: [from_leg_group_id, to_leg_group_id, transfer_count] }

fix:
  - "Empty `transfer_count` on line {{csvRowNumber}}."
  - "To limit transfers within one group, add a row whose `from_leg_group_id` and `to_leg_group_id` are that group, and give the limit there."
