code: future_calendar

steps:
  - text: "The feed was checked on {{currentDate|date}}, but its first day of service is {{minServiceStartDate|date}}. Until then, an app using only this feed has no trips to show riders."
    actions:
      - { kind: timeline, start: "{{currentDate}}", end: "{{minServiceStartDate}}", count: between, start_label: "Checked on", end_label: "First day of service" }

  - text: "Service days, opened on {{minServiceStartDate|date}}, the first day with trips."
    actions:
      - { kind: calendar, date: "{{minServiceStartDate}}" }

fix:
  - "If this feed is published ahead of a new schedule, keep the current feed available until {{minServiceStartDate|date}}, or merge the two into one feed."
  - "If the services should already be running, correct `start_date` in `calendar.txt` or the days in `calendar_dates.txt`."
