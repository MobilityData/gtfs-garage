code: forbidden_arrival_or_departure_time

locators:
  row: { file: stop_times, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `stop_times.txt`, the timetable, gives both a fixed time and a pickup and drop-off window, {{startPickupDropOffWindow}} to {{endPickupDropOffWindow}}. A window is for flex service: a zone or a time window, booked in advance, rather than fixed stops at fixed times."
    actions:
      - { kind: open_rows,   at: row, highlight: [arrival_time, departure_time, start_pickup_drop_off_window, end_pickup_drop_off_window] }
      - { kind: show_record, at: row, fields: [arrival_time, departure_time, start_pickup_drop_off_window, end_pickup_drop_off_window] }

  - text: "A row is either a stop at a set time or a window, never both. With both, apps cannot tell riders when the vehicle comes."

fix:
  - "If the service runs on demand, empty `arrival_time` and `departure_time` on line {{csvRowNumber}} of `stop_times.txt` and keep the window."
  - "If the vehicle comes at a set time, keep the times and empty `start_pickup_drop_off_window` and `end_pickup_drop_off_window`."
