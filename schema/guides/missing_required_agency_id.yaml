code: missing_required_agency_id

locators:
  row:      { file: "{{filename}}", line: "{{csvRowNumber}}" }
  agencies: { file: agency }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` leaves `agency_id`, the id that says which agency a row belongs to, empty."
    actions:
      - { kind: open_rows, at: row, highlight: [agency_id] }

  - text: "`agency.txt`, the list of agencies, has more than one agency. Then every agency needs an id, and every route and fare must name its agency, or apps cannot tell who runs it."
    actions:
      - { kind: open_rows, at: agencies, highlight: [agency_id] }

fix:
  - "Fill in `agency_id` on line {{csvRowNumber}} of `{{filename}}` with an id from `agency.txt`."
  - "If the row is in `agency.txt`, give that agency a short id of its own and use it in `routes.txt` for its routes."
