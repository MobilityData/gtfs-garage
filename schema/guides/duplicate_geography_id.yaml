code: duplicate_geography_id

locators:
  zone:  { file: locations,       key: { id: "{{geographyId}}" } }
  stop:  { file: stops,           key: { stop_id: "{{geographyId}}" } }
  group: { file: location_groups, key: { location_group_id: "{{geographyId}}" } }

steps:
  - text: "The id {{geographyId}} names more than one place. Stops in `stops.txt`, zones in `locations.geojson` and groups of stops in `location_groups.txt` share one set of ids, so a trip that points at {{geographyId}} could mean either."
    actions:
      - { kind: open_rows, at: zone, highlight: [id], expect: any }
      - { kind: map_focus, locations: ["{{geographyId}}"], stops: ["{{geographyId}}"] }

  - text: "In `stops.txt`, the list of stops, a row here means {{geographyId}} is also a stop. An empty table means it is not."
    actions:
      - { kind: open_rows, at: stop, highlight: [stop_id], expect: any }

  - text: "In `location_groups.txt`, the groups of stops that on-demand trips serve, a row here means {{geographyId}} is also a group. An empty table means it is not."
    actions:
      - { kind: open_rows, at: group, highlight: [location_group_id], expect: any }

fix:
  - "Give one of the places a new id, for example {{geographyId}}_zone, and update every row of `stop_times.txt` and `location_group_stops.txt` that points at it."
