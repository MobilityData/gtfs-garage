code: stop_time_timepoint_without_times

locators:
  row:   { file: stop_times, line: "{{csvRowNumber}}", key: { trip_id: "{{tripId}}", stop_sequence: "{{stopSequence}}" } }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Stop {{stopSequence}} of trip {{tripId}} is marked as a `timepoint`, a stop with an exact scheduled time, but its `{{specifiedField}}` is empty."
    actions:
      - { kind: open_rows, at: calls, mark: row, highlight: [arrival_time, departure_time, timepoint] }

  - text: "The trip in its timetable. Apps are told the time there is exact, yet there is no time to show, so they may reject the trip."
    actions:
      - { kind: timetable,   trip: "{{tripId}}" }
      - { kind: show_record, at: row, fields: [arrival_time, departure_time, timepoint] }

fix:
  - "Fill in `{{specifiedField}}` on line {{csvRowNumber}} of `stop_times.txt`."
  - "If the vehicle has no exact time there, leave both times empty and set `timepoint` to 0; apps then estimate the time."
