code: invalid_float

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}` the value \"{{fieldValue}}\", where a number is expected. Apps cannot use the row as it is, and may skip it or reject the feed."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "45.5017" }

  - text: "A number is written with digits only, a dot for decimals and a minus sign in front if it is negative: no words, units, spaces or commas."
    actions:
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Replace \"{{fieldValue}}\" in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` with the number it stands for, such as 45.5017."
  - "If the value was typed with a comma for decimals (45,5017), use a dot instead."
