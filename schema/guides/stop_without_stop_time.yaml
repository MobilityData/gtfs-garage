code: stop_without_stop_time

locators:
  stop:  { file: stops,      line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }
  calls: { file: stop_times, key: { stop_id: "{{stopId}}" } }

steps:
  - text: "{{stopName}} is in `stops.txt`, the list of stops, but no trip stops there."
    actions:
      - { kind: open_rows, at: stop, highlight: [stop_id, stop_name] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

  - text: "Nothing in `stop_times.txt`, the timetable, names {{stopId}}. Apps may still show the stop on their maps, where riders would wait for a vehicle that never comes."
    actions:
      - { kind: open_rows, at: calls, expect: empty }

fix:
  - "If trips do serve {{stopName}}, add it to their stops in `stop_times.txt`; a mistyped `stop_id` there is a common cause."
  - "If no trip serves it any more, remove {{stopId}} from `stops.txt` (line {{csvRowNumber}})."
