code: timeframe_start_or_end_time_greater_than_twenty_four_hours

locators:
  row: { file: timeframes, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `timeframes.txt`, the times of day a fare applies, has `{{fieldName}}` {{time}}. A timeframe is a time of day, from 00:00:00 to 24:00:00, so unlike a trip's times it cannot run past midnight."
    actions:
      - { kind: open_rows, at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{time}}", label: "{{fieldName}}", expect: "24:00:00 or earlier" }

fix:
  - "Set `{{fieldName}}` on line {{csvRowNumber}} to 24:00:00 or earlier."
  - "If the fare applies past midnight, end this row at 24:00:00 and add another row from 00:00:00 for the hours after midnight."
