code: forbidden_prior_notice_start_day

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}", key: { booking_rule_id: "{{bookingRuleId}}" } }

steps:
  - text: "Booking rule {{bookingRuleId}} (line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip) says riders can book at most {{priorNoticeDurationMax}} minutes before the trip (`prior_notice_duration_max`), and also from {{priorNoticeStartDay|days}} before (`prior_notice_start_day`). Only one of the two may say when booking opens."
    actions:
      - { kind: open_rows, at: rule, highlight: [prior_notice_duration_max, prior_notice_start_day] }
      - { kind: show_record, at: rule, fields: [booking_type, prior_notice_duration_min, prior_notice_duration_max, prior_notice_start_day, prior_notice_start_time] }

fix:
  - "If booking opens a number of minutes before the trip, empty `prior_notice_start_day` and `prior_notice_start_time` for booking rule {{bookingRuleId}}."
  - "If booking opens on a day before the trip, empty `prior_notice_duration_max` and set `booking_type` to 2, booking one or more days before."
