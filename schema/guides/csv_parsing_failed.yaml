code: csv_parsing_failed

locators:
  row:  { file: "{{filename}}", line: "{{lineIndex|from1}}" }

steps:
  - text: "The validator could not read `{{filename}}` past line {{lineIndex|from1}}, so the rest of the file was not checked. The usual cause is a value over 4096 characters, or a quote never closed."
    actions:
      - { kind: show_files, mark: ["{{filename}}"] }

  - text: "Look at column {{columnIndex|from1}} on line {{lineIndex|from1}}: a value far longer than the others, or one that swallows the columns after it."
    actions:
      - { kind: open_rows, at: row, around: 2 }

fix:
  - "Open `{{filename}}` in a text editor at line {{lineIndex|from1}} and shorten the value in column {{columnIndex|from1}} to under 4096 characters, or close its quote."
  - "Validate the feed again afterwards, because problems later in `{{filename}}` only show up once it can be read to the end."
