code: transfer_with_invalid_trip_and_stop

locators:
  transfer: { file: transfers, line: "{{csvRowNumber}}" }
  calls:    { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Line {{csvRowNumber}} of `transfers.txt`, the changes riders can make, says riders change at stop {{stopId}} on trip {{tripId}}. But trip {{tripId}} never stops at {{stopId}}."
    actions:
      - { kind: open_rows, at: transfer, highlight: ["{{stopFieldName}}", "{{tripFieldName}}"] }

  - text: "These are the stops trip {{tripId}} makes, from `stop_times.txt`, the timetable. {{stopId}} is not among them, so apps cannot offer a change there from that trip."
    actions:
      - { kind: open_rows,    at: calls, highlight: [stop_id, stop_sequence] }
      - { kind: map_sequence, trip: "{{tripId}}" }
      - { kind: map_focus,    stops: ["{{stopId}}"] }

fix:
  - "On line {{csvRowNumber}} of `transfers.txt`, change `{{stopFieldName}}` to a stop trip {{tripId}} really makes."
  - "If the stop is right, change `{{tripFieldName}}` to a trip that stops at {{stopId}}."
