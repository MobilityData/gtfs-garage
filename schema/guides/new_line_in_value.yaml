code: new_line_in_value

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "The `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` has a line break inside it. Many apps read one row per line, so they split this row in two."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the file has it" }

fix:
  - "Replace the line break in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` with a space."
  - "If the break comes from a double quote that was never closed, close it where the value ends."
