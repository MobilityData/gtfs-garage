code: trip_distance_exceeds_shape_distance_below_threshold

locators:
  calls:  { file: stop_times, key: { trip_id: "{{tripId}}" } }
  points: { file: shapes,     key: { shape_id: "{{shapeId}}" } }

steps:
  - text: "Trip {{tripId}} puts its last stop at distance {{maxTripDistanceTraveled|round}} along its line, just past the end of shape {{shapeId}} at {{maxShapeDistanceTraveled|round}}. The last stop is {{geoDistanceToShape|m}} beyond the end."
    point: map
    actions:
      - { kind: open_rows,    at: calls, highlight: [stop_sequence, shape_dist_traveled] }
      - { kind: map_focus,    shapes: ["{{shapeId}}"] }
      - { kind: map_sequence, trip: "{{tripId}}" }

  - text: "The points of shape {{shapeId}}, each with its `shape_dist_traveled`. The gap is small, often rounding, but apps may draw the trip ending just short of its last stop."
    actions:
      - { kind: open_rows, at: points, highlight: [shape_pt_sequence, shape_dist_traveled] }

fix:
  - "Extend shape {{shapeId}} to the last stop of trip {{tripId}}, or lower that stop's `shape_dist_traveled` in `stop_times.txt` to {{maxShapeDistanceTraveled|round}}."
  - "Check that both files round distances the same way."
