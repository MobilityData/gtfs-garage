code: forbidden_geography_id

locators:
  row: { file: stop_times, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `stop_times.txt`, the timetable, names both stop {{stopId}} and zone {{locationId}}. A row must name exactly one of a stop (`stop_id`), a zone (`location_id`) or a group of stops (`location_group_id`), or apps cannot tell where the vehicle goes."
    actions:
      - { kind: open_rows,   at: row, highlight: [stop_id, location_id, location_group_id] }
      - { kind: show_record, at: row, fields: [stop_id, location_id, location_group_id] }
      - { kind: map_focus,   stops: ["{{stopId}}"], locations: ["{{locationId}}"] }

fix:
  - "On line {{csvRowNumber}} of `stop_times.txt`, keep only the place this row is about: `stop_id` {{stopId}} for a fixed stop, or `location_id` {{locationId}} for a zone served on demand."
  - "If the trip really serves both, split this into two rows, each with its own `stop_sequence`."
