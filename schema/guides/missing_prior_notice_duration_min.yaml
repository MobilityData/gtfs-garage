code: missing_prior_notice_duration_min

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}", key: { booking_rule_id: "{{bookingRuleId}}" } }

steps:
  - text: "Booking rule {{bookingRuleId}} (line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip) is for trips booked earlier the same day (`booking_type` 1), but it does not say how many minutes before the trip riders must book (`prior_notice_duration_min`)."
    actions:
      - { kind: open_rows, at: rule, highlight: [booking_type, prior_notice_duration_min] }
      - { kind: show_record, at: rule }

fix:
  - "Set `prior_notice_duration_min` for booking rule {{bookingRuleId}} to the minutes of notice riders must give, for example 60 for an hour."
  - "If riders actually book one or more days before, set `booking_type` to 2 and give the deadline in `prior_notice_last_day` and `prior_notice_last_time`."
