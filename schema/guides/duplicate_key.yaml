code: duplicate_key

locators:
  first:  { file: "{{filename}}", line: "{{oldCsvRowNumber}}" }
  second: { file: "{{filename}}", line: "{{newCsvRowNumber}}" }
  both:   { file: "{{filename}}", line: "{{oldCsvRowNumber}},{{newCsvRowNumber}}" }

steps:
  # For a composite key, 8.0.1 packs every column into fieldName1 ("service_id,date")
  # and every value into fieldValue1; highlight splits a list of columns on commas.
  - text: "Lines {{oldCsvRowNumber}} and {{newCsvRowNumber}} of `{{filename}}` have the same `{{fieldName1}}`: {{fieldValue1}}. No two rows may share it, so apps keep one and drop the other."
    actions:
      - { kind: open_rows,       at: both, highlight: ["{{fieldName1}}", "{{fieldName2}}"] }
      - { kind: compare_records, a: first, b: second }

fix:
  - "If lines {{oldCsvRowNumber}} and {{newCsvRowNumber}} say the same thing, delete one of them."
  - "If they are meant to be different, change `{{fieldName1}}` on one of them, and anything elsewhere in the feed that uses it."
