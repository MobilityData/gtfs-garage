code: missing_required_field

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` leaves `{{fieldName}}` empty, and GTFS requires a value there. Apps may skip the row, or reject the file."
    actions:
      - { kind: open_rows,   at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Fill in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}`."
  - "Some columns are required only when another one is set; the card above says what makes `{{fieldName}}` required on this row."
