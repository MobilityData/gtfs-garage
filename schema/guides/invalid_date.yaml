code: invalid_date

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}` the value \"{{fieldValue}}\", which is not a real date. Apps cannot tell which days the service runs, and may drop it or reject the feed."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "20261015" }

  - text: "A date is written as year, month and day with nothing between them: 20261015 is 15 October 2026. The month goes from 01 to 12 and the day must exist in that month."
    actions:
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Correct `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` to a real date written as YYYYMMDD, such as 20261231."
  - "If the dates come from a spreadsheet, format the column as plain text so it does not turn them into another date format."
