code: runtime_exception_in_loader_error

steps:
  - text: "This is most likely not a problem in the feed's data: the validator itself failed while reading `{{filename}}`, so that file was not checked."
    actions:
      - { kind: show_files, mark: ["{{filename}}"] }
      - { kind: show_value, value: "{{message}}", label: "What the validator reported" }

fix:
  - "Run the validator again."
  - "If it happens again, report it to the gtfs-validator project on GitHub, with the message above, the error name {{exception}} and, if you can, `{{filename}}`."
