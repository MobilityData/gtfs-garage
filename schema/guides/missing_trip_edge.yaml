code: missing_trip_edge

locators:
  row:   { file: stop_times, line: "{{csvRowNumber}}", key: { trip_id: "{{tripId}}", stop_sequence: "{{stopSequence}}" } }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Stop {{stopSequence}} is where trip {{tripId}} starts or ends, and it has no `{{specifiedField}}`. The first and last stops of a trip must have both an arrival and a departure time."
    actions:
      - { kind: open_rows,    at: calls, mark: row, highlight: [arrival_time, departure_time] }
      - { kind: map_sequence, trip: "{{tripId}}" }

  - text: "The trip in its timetable, with a gap at one end. Apps cannot say when the trip starts or ends, and may drop it from journey plans."
    actions:
      - { kind: timetable,   trip: "{{tripId}}" }
      - { kind: show_record, at: row, fields: [arrival_time, departure_time] }

fix:
  - "Fill in `{{specifiedField}}` on line {{csvRowNumber}} of `stop_times.txt`; if the vehicle does not wait there, use the same time for `arrival_time` and `departure_time`."
  - "If the trip really starts or ends at another stop, add that stop to the trip with both times."
