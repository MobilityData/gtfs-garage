code: route_both_short_and_long_name_missing

locators:
  route: { file: routes, line: "{{csvRowNumber}}", key: { route_id: "{{routeId}}" } }

steps:
  - text: "Route {{routeId}} has no name: in `routes.txt`, both `route_short_name`, the number riders know it by, and `route_long_name`, its full name, are empty. Apps have nothing to show riders, and some reject the feed."
    actions:
      - { kind: open_rows,   at: route, highlight: [route_short_name, route_long_name] }
      - { kind: show_record, at: route, fields: [route_id, route_short_name, route_long_name, route_desc] }

fix:
  - "Give route {{routeId}} a `route_short_name` (the number riders know it by), a `route_long_name`, or both."
