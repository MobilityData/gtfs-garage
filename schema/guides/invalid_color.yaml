code: invalid_color

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}` the value \"{{fieldValue}}\", which is not a colour an app can read. Apps cannot draw the route in its colour, and may fall back to a default one or reject the value."
    actions:
      - { kind: open_rows,   at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_colors, color: "{{fieldValue}}" }

  - text: "A colour is written as six hexadecimal digits (0 to 9 and A to F) with no # in front: 0000FF is blue, FFFFFF is white, 000000 is black."
    actions:
      - { kind: show_value,  value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "0055A4" }
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Replace \"{{fieldValue}}\" in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` with a six-digit colour code, such as 0000FF for blue."
  - "Take the code from the agency's brand colours or its printed maps, so apps draw the route the way riders know it."
  - "If the value has a # in front, remove it."
