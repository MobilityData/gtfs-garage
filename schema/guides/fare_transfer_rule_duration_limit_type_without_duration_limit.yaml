code: fare_transfer_rule_duration_limit_type_without_duration_limit

locators:
  rule: { file: fare_transfer_rules, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `fare_transfer_rules.txt`, what a transfer between two fares costs, says how the transfer's time limit is counted (`duration_limit_type`) but not how long it is (`duration_limit`). Apps cannot tell riders how long the transfer price lasts."
    actions:
      - { kind: open_rows, at: rule, highlight: [duration_limit, duration_limit_type] }
      - { kind: show_record, at: rule, fields: [from_leg_group_id, to_leg_group_id, duration_limit, duration_limit_type] }

fix:
  - "If the transfer has a time limit, put its length in seconds in `duration_limit` on line {{csvRowNumber}}, for example 5400 for 90 minutes."
  - "If the transfer has no time limit, empty `duration_limit_type` on line {{csvRowNumber}}."
