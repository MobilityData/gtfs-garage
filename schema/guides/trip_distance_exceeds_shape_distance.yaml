code: trip_distance_exceeds_shape_distance

locators:
  calls:  { file: stop_times, key: { trip_id: "{{tripId}}" } }
  points: { file: shapes,     key: { shape_id: "{{shapeId}}" } }

steps:
  - text: "Trip {{tripId}} puts its last stop at distance {{maxTripDistanceTraveled|round}} along its line, but that line, shape {{shapeId}}, ends at {{maxShapeDistanceTraveled|round}}. The last stop is {{geoDistanceToShape|m}} beyond the end."
    point: map
    actions:
      - { kind: open_rows,    at: calls, highlight: [stop_sequence, shape_dist_traveled] }
      - { kind: map_focus,    shapes: ["{{shapeId}}"] }
      - { kind: map_sequence, trip: "{{tripId}}" }

  - text: "The points of shape {{shapeId}}, each with its `shape_dist_traveled`: none reaches {{maxTripDistanceTraveled|round}}. Apps cannot draw the end of the trip, and may show it stopping short."
    actions:
      - { kind: open_rows, at: points, highlight: [shape_pt_sequence, shape_dist_traveled] }

fix:
  - "If the line stops short, extend shape {{shapeId}} to the last stop of trip {{tripId}}."
  - "If the distances are wrong, correct `shape_dist_traveled` in `stop_times.txt` so no stop of {{tripId}} is past {{maxShapeDistanceTraveled|round}}."
  - "Check that `stop_times.txt` and `shapes.txt` measure distances in the same unit."
