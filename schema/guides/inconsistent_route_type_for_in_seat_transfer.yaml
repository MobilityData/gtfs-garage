code: inconsistent_route_type_for_in_seat_transfer

locators:
  transfer:   { file: transfers, line: "{{csvRowNumber}}" }
  from_route: { file: routes, key: { route_id: "{{fromRouteId}}" } }
  to_route:   { file: routes, key: { route_id: "{{toRouteId}}" } }

steps:
  - text: "Line {{csvRowNumber}} of `transfers.txt`, the connections between services, says riders stay in their seat from {{fromRouteType|words}} route {{fromRouteId}} to {{toRouteType|words}} route {{toRouteId}}."
    actions:
      - { kind: open_rows, at: transfer, highlight: [from_route_id, to_route_id, transfer_type] }

  - text: "`route_type` says what kind of vehicle runs a route. Staying seated only works when the same vehicle carries on, and one vehicle cannot run as both {{fromRouteType|words}} and {{toRouteType|words}}. Apps may tell riders to stay on board when they have to change."
    actions:
      - { kind: compare_records, a: from_route, b: to_route, fields: [route_short_name, route_long_name, route_type] }
      - { kind: map_focus, routes: ["{{fromRouteId}}", "{{toRouteId}}"] }

fix:
  - "If riders really change vehicles, set `transfer_type` on line {{csvRowNumber}} of `transfers.txt` to 0, 1 or 2 instead of 4."
  - "If the same vehicle does carry on, correct the `route_type` of {{fromRouteId}} or {{toRouteId}} so both name the same kind of vehicle."
