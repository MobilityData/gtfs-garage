code: expired_calendar

locators:
  service: { file: calendar, line: "{{csvRowNumber}}", key: { service_id: "{{serviceId}}" } }
  days:    { file: calendar_dates, key: { service_id: "{{serviceId}}" } }

steps:
  - text: "Service {{serviceId}} has no days left to run: its last day had already passed when the feed was checked. This is its row on line {{csvRowNumber}} of `calendar.txt`, the weekly pattern of days each service runs."
    actions:
      - { kind: open_rows,   at: service, highlight: [start_date, end_date] }
      - { kind: show_record, at: service, fields: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, start_date, end_date] }

  - text: "Service days shows when the feed has service. {{serviceId}} has no days left there. Riders see nothing wrong, but old services make the feed harder to keep up to date."
    actions:
      - { kind: calendar }

  - text: "These are the single days `calendar_dates.txt`, the list of days added or removed, gives {{serviceId}}, if any. They are all in the past too."
    actions:
      - { kind: open_rows, at: days, expect: any, highlight: [date, exception_type] }

fix:
  - "If service {{serviceId}} has ended, remove its row from `calendar.txt`, its days in `calendar_dates.txt` and the trips that use it."
  - "If it is still running, set `end_date` on line {{csvRowNumber}} of `calendar.txt` to its real last day and mark the weekdays it runs with 1."
  - "A service marked 0 for every weekday only runs on the days `calendar_dates.txt` adds, so it can run out even when its `end_date` is still ahead."
