code: route_short_name_too_long

locators:
  route: { file: routes, line: "{{csvRowNumber}}", key: { route_id: "{{routeId}}" } }

steps:
  - text: "Route {{routeId}}'s short name, {{routeShortName}}, is longer than 12 characters. `route_short_name` in `routes.txt` is the number or code riders see on the vehicle and in an app's badge, like 10 or N; a long one gets cut off."
    actions:
      - { kind: open_rows,   at: route, highlight: [route_short_name, route_long_name] }
      - { kind: show_record, at: route, fields: [route_short_name, route_long_name] }

fix:
  - "Move {{routeShortName}} to `route_long_name` of route {{routeId}}, and give `route_short_name` a short code or leave it empty."
