code: missing_feed_info_date

locators:
  feed: { file: feed_info, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `feed_info.txt`, the feed's description of itself, gives only one end of the period the feed is valid for: `{{fieldName}}` is empty. Apps cannot tell when the feed stops or starts being valid."
    actions:
      - { kind: open_rows,   at: feed, highlight: [feed_start_date, feed_end_date] }
      - { kind: show_record, at: feed, fields: [feed_start_date, feed_end_date] }

fix:
  - "Fill in `{{fieldName}}` on line {{csvRowNumber}} of `feed_info.txt`, or leave both `feed_start_date` and `feed_end_date` empty."
