code: geo_json_duplicated_element

steps:
  - text: "`{{filename}}`, the file of zones that on-demand trips serve, gives `{{duplicatedElement}}` twice in the same place. Apps keep only one of the two, and which one is not defined, so riders may see the wrong zones or none."
    actions:
      - { kind: show_value, value: "{{duplicatedElement}}", label: "The name given twice" }
      - { kind: show_files, mark: ["{{filename}}"] }

fix:
  - "Open `{{filename}}` in a text editor, find the two `{{duplicatedElement}}` entries, and delete the one that is wrong."
