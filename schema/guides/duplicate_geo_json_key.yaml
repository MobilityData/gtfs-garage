code: duplicate_geo_json_key

locators:
  zones: { file: locations, key: { id: "{{featureId}}" } }

steps:
  - text: "Zones {{firstIndex|from1}} and {{secondIndex|from1}} of `locations.geojson`, the file of zones that on-demand trips serve, have the same `id`, {{featureId}}. An id must name one zone, so a trip that points at {{featureId}} could mean either."
    actions:
      - { kind: open_rows, at: zones, highlight: [id, stop_name] }
      - { kind: map_focus, locations: ["{{featureId}}"] }

fix:
  - "If the two zones are the same place, delete one of them from `locations.geojson`."
  - "If they are different places, give one of them a new `id`, and update any `location_id` in `stop_times.txt` that should point at it."
