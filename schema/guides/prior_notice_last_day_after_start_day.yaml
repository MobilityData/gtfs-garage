code: prior_notice_last_day_after_start_day

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip, opens booking {{priorNoticeStartDay|days}} before the trip (`prior_notice_start_day`) but closes it {{priorNoticeLastDay|days}} before (`prior_notice_last_day`). Booking closes before it opens, so riders can never book."
    actions:
      - { kind: open_rows, at: rule, highlight: [prior_notice_last_day, prior_notice_start_day] }
      - { kind: show_record, at: rule, fields: [booking_type, prior_notice_last_day, prior_notice_last_time, prior_notice_start_day, prior_notice_start_time] }

fix:
  - "If the two were entered the wrong way round, set `prior_notice_start_day` to {{priorNoticeLastDay}} and `prior_notice_last_day` to {{priorNoticeStartDay}} on line {{csvRowNumber}}."
  - "Otherwise, make `prior_notice_start_day` at least {{priorNoticeLastDay}}, so booking opens on or before the day it closes."
