code: forbidden_pickup_type

locators:
  row: { file: stop_times, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `stop_times.txt`, the timetable, gives a pickup and drop-off window, {{startPickupDropOffWindow}} to {{endPickupDropOffWindow}}. But its `pickup_type`, how riders get on, is 0 (a scheduled pickup) or 3 (arranged with the driver at the stop)."
    actions:
      - { kind: open_rows,   at: row, highlight: [pickup_type, start_pickup_drop_off_window, end_pickup_drop_off_window] }
      - { kind: show_record, at: row, fields: [pickup_type, start_pickup_drop_off_window, end_pickup_drop_off_window] }

  - text: "A window is for flex service: a zone or a time window, booked in advance, rather than fixed stops at fixed times. Neither a scheduled pickup nor one arranged at the stop fits that."

fix:
  - "On line {{csvRowNumber}} of `stop_times.txt`, set `pickup_type` to 2 if riders must phone to book, or 1 if they cannot get on here."
  - "If this really is a regular scheduled stop, remove the window and give the row an arrival and departure time instead."
