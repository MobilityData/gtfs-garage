code: missing_prior_notice_last_time

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}", key: { booking_rule_id: "{{bookingRuleId}}" } }

steps:
  - text: "Booking rule {{bookingRuleId}} (line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip) is for trips booked one or more days before (`booking_type` 2), but it does not say at what time booking closes (`prior_notice_last_time`). Riders cannot tell when it is too late."
    actions:
      - { kind: open_rows, at: rule, highlight: [booking_type, prior_notice_last_time] }
      - { kind: show_record, at: rule }

fix:
  - "Set `prior_notice_last_time` for booking rule {{bookingRuleId}} to the time booking closes on the last day, for example 17:00:00 for 5 pm."
  - "If riders can actually book the same day, set `booking_type` to 1 and give the notice in minutes in `prior_notice_duration_min`."
