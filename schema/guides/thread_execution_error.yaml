code: thread_execution_error

steps:
  - text: "This is not a problem in the feed's data: the validator failed while running its checks side by side. The rest of the report may be incomplete."
    actions:
      - { kind: show_value, value: "{{message}}", label: "What the validator reported" }

fix:
  - "Run the validator again."
  - "If it happens again, report it to the gtfs-validator project on GitHub, with the message above and the error name {{exception}}."
