code: point_near_origin

locators:
  place: { file: "{{filename}}", key: { id: "{{entityId}}" } }

steps:
  - text: "A place in `{{filename}}` is at {{latFieldValue|coord}}, {{lonFieldValue|coord}}, close to latitude 0, longitude 0, in the ocean off West Africa. That is almost always a coordinate left at zero, not a real position."
    point: map
    actions:
      - { kind: map_focus, points: [["{{latFieldValue}}", "{{lonFieldValue}}"]] }

  - text: "It is part of {{entityId}}, an area riders can be picked up or dropped off in. With a point out at sea, apps would stretch the area across the ocean, or not show it."
    actions:
      - { kind: open_rows, at: place }

fix:
  - "Correct the coordinates of this place in `{{filename}}` to where it really is."
  - "Look for a 0 left in the latitude or longitude, or the two swapped: they are the usual cause."
