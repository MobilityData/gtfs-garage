code: fare_transfer_rule_duration_limit_without_type

locators:
  rule: { file: fare_transfer_rules, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `fare_transfer_rules.txt`, what a transfer between two fares costs, gives the transfer a time limit (`duration_limit`, in seconds) but not when that time starts and stops counting (`duration_limit_type`). Apps cannot tell riders if they are still within it."
    actions:
      - { kind: open_rows, at: rule, highlight: [duration_limit, duration_limit_type] }
      - { kind: show_record, at: rule, fields: [from_leg_group_id, to_leg_group_id, duration_limit, duration_limit_type] }

fix:
  - "Set `duration_limit_type` on line {{csvRowNumber}} to say how the time limit is counted."
  - "Use 0 to count from boarding the first vehicle to getting off the next, or 1 from boarding the first to boarding the next."
  - "Use 2 to count from getting off the first vehicle to boarding the next, or 3 from getting off the first to getting off the next."
  - "If the transfer has no time limit, empty `duration_limit` on line {{csvRowNumber}} instead."
