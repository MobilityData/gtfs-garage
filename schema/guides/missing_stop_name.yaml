code: missing_stop_name

locators:
  stop: { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }

steps:
  - text: "Line {{csvRowNumber}} of `stops.txt`, the list of stops and stations, is a {{locationType|words}} with no `stop_name`. Stops, stations and entrances need a name: riders see it in apps, on screens and in announcements."
    actions:
      - { kind: open_rows, at: stop, highlight: [stop_name, location_type] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

fix:
  - "Fill in `stop_name` for {{stopId}} on line {{csvRowNumber}} of `stops.txt` with the name on the sign at the stop."
  - "If the row is really a node inside a station or a boarding area, set `location_type` to 3 or 4, which may go without a name."
