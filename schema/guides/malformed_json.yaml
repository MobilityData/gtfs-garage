code: malformed_json

steps:
  - text: "`{{filename}}` could not be read because it is not valid JSON, the text format the file must be written in. When this is `locations.geojson`, the file of zones that on-demand trips serve, none of its zones can be used. The message says where reading stopped."
    actions:
      - { kind: show_value, value: "{{message}}", label: "Where reading stopped" }
      - { kind: show_files, mark: ["{{filename}}"] }

fix:
  - "Open `{{filename}}` in a text editor or a JSON checker, go to the line and column in the message, and repair the text there."
  - "The usual causes are a file cut short, a missing comma, bracket or quote, or a comma after the last item of a list."
  - "If the file was cut short, export it again from the tool that made it."
