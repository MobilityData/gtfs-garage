code: duplicated_column

steps:
  - text: "The header of `{{filename}}`, its first line, names `{{fieldName}}` twice: as column {{firstIndex}} and as column {{secondIndex}}. Apps cannot tell which of the two values to use."
    actions:
      - { kind: show_columns, file: "{{filename}}", mark: ["{{fieldName}}"] }

fix:
  - "Delete one of the two `{{fieldName}}` columns from `{{filename}}`, keeping the one with the right values."
  - "If the second one was meant to be a different column, rename it in the header."
