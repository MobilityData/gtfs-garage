code: same_stop_and_agency_url

locators:
  stop:   { file: stops,  line: "{{stopCsvRowNumber}}",   key: { stop_id: "{{stopId}}" } }
  agency: { file: agency, line: "{{agencyCsvRowNumber}}" }

steps:
  - text: "Stop {{stopId}} links to {{stopUrl}}, the same web page as the agency {{agencyName}}. `stop_url` should be a page about this stop: its departures, its map, how accessible it is."
    actions:
      - { kind: open_rows, at: stop, highlight: [stop_url] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

  - text: "This is {{agencyName}} in `agency.txt`, with the same address in `agency_url`. A rider who taps the stop's link lands on the agency's home page instead."
    actions:
      - { kind: open_rows, at: agency, highlight: [agency_url] }

fix:
  - "Set `stop_url` of {{stopId}} to a page about that stop, or leave it empty if there is none."
