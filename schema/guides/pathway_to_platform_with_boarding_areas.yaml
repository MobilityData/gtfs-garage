code: pathway_to_platform_with_boarding_areas

locators:
  pathway:        { file: pathways, line: "{{csvRowNumber}}", key: { pathway_id: "{{pathwayId}}" } }
  boarding_areas: { file: stops, key: { parent_station: "{{stopId}}", location_type: "4" } }

steps:
  - text: "Pathway {{pathwayId}}, line {{csvRowNumber}} of `pathways.txt`, leads to platform {{stopId}}. But that platform is divided into boarding areas: the parts where riders wait for a given door or car."
    actions:
      - { kind: open_rows, at: pathway, highlight: ["{{fieldName}}"] }

  - text: "These are the boarding areas of {{stopId}} in `stops.txt`. Once a platform has them, pathways must lead to the boarding areas, so apps can guide riders to the right part of the platform."
    actions:
      - { kind: open_rows, at: boarding_areas, highlight: [location_type, parent_station] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

fix:
  - "On line {{csvRowNumber}} of `pathways.txt`, change `{{fieldName}}` from {{stopId}} to the boarding area the walkway reaches."
  - "If the walkway reaches several boarding areas, add a pathway to each of them."
