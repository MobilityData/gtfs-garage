code: duplicate_fare_media

locators:
  first: { file: fare_media, line: "{{csvRowNumber1}}", key: { fare_media_id: "{{fareMediaId1}}" } }
  second: { file: fare_media, line: "{{csvRowNumber2}}", key: { fare_media_id: "{{fareMediaId2}}" } }
  both: { file: fare_media, line: "{{csvRowNumber1}},{{csvRowNumber2}}" }

steps:
  - text: "Fare media {{fareMediaId1}} and {{fareMediaId2}} have the same name and type in `fare_media.txt`, the ways riders can pay (a card, a ticket, an app). Riders and apps cannot tell them apart."
    actions:
      - { kind: open_rows, at: both, highlight: [fare_media_name, fare_media_type] }
      - { kind: compare_records, a: first, b: second }

fix:
  - "If {{fareMediaId1}} and {{fareMediaId2}} are the same card or ticket, delete one and point its fare products in `fare_products.txt` at the other."
  - "If they really are different, give each a `fare_media_name` riders will recognise."
