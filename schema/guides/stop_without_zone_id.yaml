code: stop_without_zone_id

locators:
  stop:       { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }
  fare_rules: { file: fare_rules }

steps:
  - text: "{{stopName}} ({{stopId}}) has no `zone_id`, the fare zone it is in, but a route that stops there has fares that depend on zones."
    actions:
      - { kind: open_rows, at: stop, highlight: [zone_id] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

  - text: "These are the rules in `fare_rules.txt`; some price a trip by the zones it starts in, ends in or passes through. Without a zone for {{stopName}}, apps cannot work out the fare to or from it."
    actions:
      - { kind: open_rows, at: fare_rules, highlight: [route_id, origin_id, destination_id] }

fix:
  - "Set `zone_id` for {{stopId}} in `stops.txt` to the fare zone it is in, one of the zones the fare rules use."
