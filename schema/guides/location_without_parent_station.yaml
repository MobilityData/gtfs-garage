code: location_without_parent_station

locators:
  stop: { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }

steps:
  - text: "{{stopName}} ({{stopId}}), line {{csvRowNumber}} of `stops.txt`, the list of stops and stations, is part of a station. But its `parent_station` is empty, so nothing says which station."
    actions:
      - { kind: open_rows, at: stop, highlight: [location_type, parent_station] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

  - text: "`location_type` is the kind of place: 0 a stop or platform, 1 a station, 2 an entrance, 3 a node inside a station, 4 a boarding area. This row is a {{locationType}}, which only exists inside a station or platform."
    actions:
      - { kind: show_record, at: stop, fields: [stop_name, location_type, parent_station] }

fix:
  - "Set `parent_station` of {{stopId}} to the `stop_id` of its station, or, for a boarding area, of its platform."
  - "If {{stopId}} is really a stop on its own, set its `location_type` to 0."
