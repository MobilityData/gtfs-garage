code: more_than_one_entity

locators:
  file: { file: "{{filename}}" }

steps:
  - text: "`{{filename}}` has {{entityCount}} rows, but it should have one: it describes the feed as a whole. Apps read only one row, and may pick the wrong one."
    actions:
      - { kind: open_rows, at: file }

fix:
  - "Keep the one row of `{{filename}}` that is correct and delete the others."
