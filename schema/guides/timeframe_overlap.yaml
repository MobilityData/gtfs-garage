code: timeframe_overlap

locators:
  group: { file: timeframes, key: { timeframe_group_id: "{{timeframeGroupId}}", service_id: "{{serviceId}}" } }
  both: { file: timeframes, line: "{{prevCsvRowNumber}},{{currCsvRowNumber}}" }
  first: { file: timeframes, line: "{{prevCsvRowNumber}}" }
  second: { file: timeframes, line: "{{currCsvRowNumber}}" }

steps:
  - text: "Timeframe {{timeframeGroupId}} on service {{serviceId}} has two periods in `timeframes.txt`, the times of day a fare applies. Line {{prevCsvRowNumber}} ends at {{prevEndTime}}, but line {{currCsvRowNumber}} starts at {{currStartTime}}."
    actions:
      - { kind: open_rows, at: group, mark: both, highlight: [start_time, end_time] }
      - { kind: compare_records, a: first, b: second, fields: [start_time, end_time] }

  - text: "From {{currStartTime}} to {{prevEndTime}} the two periods overlap. A timeframe's periods must not overlap, or apps cannot be sure which fare a rider pays."
    actions:
      - { kind: timeline, start: "{{currStartTime}}", end: "{{prevEndTime}}", start_label: "Line {{currCsvRowNumber}} starts", end_label: "Line {{prevCsvRowNumber}} ends" }

fix:
  - "Set `end_time` on line {{prevCsvRowNumber}} to {{currStartTime}}, or `start_time` on line {{currCsvRowNumber}} to {{prevEndTime}}, so one period ends where the next starts."
  - "If one period was meant to extend the other, merge lines {{prevCsvRowNumber}} and {{currCsvRowNumber}} into one row from the earlier start to the later end."
