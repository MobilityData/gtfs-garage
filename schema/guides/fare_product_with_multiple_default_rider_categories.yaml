code: fare_product_with_multiple_default_rider_categories

locators:
  prices: { file: fare_products, line: "{{csvRowNumber1}},{{csvRowNumber2}}", key: { fare_product_id: "{{fareProductId}}" } }
  category1: { file: rider_categories, key: { rider_category_id: "{{riderCategoryId1}}" } }
  category2: { file: rider_categories, key: { rider_category_id: "{{riderCategoryId2}}" } }
  categories: { file: rider_categories }

steps:
  - text: "Fare product {{fareProductId}} has a price for {{riderCategoryId1}} and one for {{riderCategoryId2}}, and both are marked as the default. `fare_products.txt` lists the fares riders can buy, one row per price."
    actions:
      - { kind: open_rows, at: prices, highlight: [rider_category_id, amount] }

  - text: "In `rider_categories.txt`, the kinds of rider (adult, senior, student), both have `is_default_fare_category` set to 1. Apps show the default price to riders who have not said who they are, so a fare can have only one."
    actions:
      - { kind: open_rows, at: categories, highlight: [is_default_fare_category] }
      - { kind: compare_records, a: category1, b: category2 }

fix:
  - "Choose which of {{riderCategoryId1}} and {{riderCategoryId2}} is the default, usually the standard adult fare, and set `is_default_fare_category` to 0 for the other in `rider_categories.txt`."
