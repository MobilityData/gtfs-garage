code: missing_level_id

locators:
  stop:      { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }
  elevators: { file: pathways, key: { pathway_mode: "5" } }
  levels:    { file: levels }

steps:
  - text: "{{stopName}} ({{stopId}}) is at one end of an elevator, but its `level_id`, the floor it is on, is empty."
    actions:
      - { kind: open_rows, at: stop, highlight: [level_id] }

  - text: "These are the elevators in `pathways.txt`, the walkways and lifts inside stations. An elevator links two floors, so apps need the floor at each end to tell riders where it goes."
    actions:
      - { kind: open_rows, at: elevators, highlight: [from_stop_id, to_stop_id, pathway_mode] }

  - text: "`levels.txt` lists the floors of the stations. The `level_id` of {{stopId}} has to be one of them."
    actions:
      - { kind: open_rows, at: levels }

fix:
  - "Set `level_id` of {{stopId}} in `stops.txt` to the floor it is on, one of the values in `levels.txt`."
  - "If `levels.txt` does not list that floor yet, add a row for it, with a `level_index` of 0 for street level and negative numbers below."
