code: inconsistent_route_type_for_block_id

locators:
  block:  { file: trips,  key: { block_id: "{{blockId}}" } }
  routes: { file: routes }

steps:
  - text: "Block {{blockId}} puts trips of routes {{routeIds}} on one vehicle, but those routes use different kinds of vehicle: {{routeTypes|words}}. One vehicle cannot be both."
    point: rows
    actions:
      - { kind: open_rows, at: block, highlight: [block_id, route_id] }
      - { kind: map_focus, routes: ["{{routeIds}}"] }

  - text: "In `routes.txt`, the list of routes, `route_type` says what kind of vehicle each route uses. An app telling riders their bus continues as the next trip would announce the wrong vehicle."
    actions:
      - { kind: open_rows, at: routes, highlight: [route_id, route_type] }

fix:
  - "If different vehicles run these trips, give them different `block_id` values in `trips.txt`."
  - "If one of routes {{routeIds}} has the wrong `route_type`, correct it in `routes.txt`."
