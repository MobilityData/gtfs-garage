code: geo_json_unknown_element

steps:
  - text: "`{{filename}}`, the file of zones that on-demand trips serve, contains `{{unknownElement}}`, which GTFS does not define for that file. Apps ignore it. That is harmless for a note to yourself, but if it was meant to describe a zone, riders never see it."
    actions:
      - { kind: show_value, value: "{{unknownElement}}", label: "The name GTFS does not know" }

fix:
  - "If `{{unknownElement}}` is misspelt or sits at the wrong level of `{{filename}}`, rename or move it to what GTFS expects."
  - "If it is extra information for your own tools, you can leave it as it is."
