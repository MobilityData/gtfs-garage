code: wrong_parent_location_type

locators:
  stop:   { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }
  parent: { file: stops, line: "{{parentCsvRowNumber}}", key: { stop_id: "{{parentStation}}" } }

steps:
  - text: "{{stopName}} ({{stopId}}) names {{parentStopName}} ({{parentStation}}) as its `parent_station`, but that is the wrong kind of place for it to belong to."
    actions:
      - { kind: open_rows, at: stop, highlight: [location_type, parent_station] }
      - { kind: map_focus, stops: ["{{stopId}}", "{{parentStation}}"] }

  - text: "`location_type` is the kind of place: 0 a stop or platform, 1 a station, 2 an entrance, 3 a node inside a station, 4 a boarding area. {{stopId}} is a {{locationType}}, so its parent should be a {{expectedLocationType}}, not a {{parentLocationType}}."
    actions:
      - { kind: compare_records, a: stop, b: parent, fields: [stop_name, location_type, parent_station] }

fix:
  - "Set `parent_station` of {{stopId}} to a row with `location_type` {{expectedLocationType}}, such as the station it is in."
  - "If {{parentStation}} is the right parent, correct the `location_type` of one of the two rows."
