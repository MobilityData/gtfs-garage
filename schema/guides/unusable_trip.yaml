code: unusable_trip

locators:
  trip:  { file: trips,      line: "{{csvRowNumber}}", key: { trip_id: "{{tripId}}" } }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Trip {{tripId}} has fewer than two stops, so no one can ride it from one stop to another. Apps leave it out of journey plans."
    actions:
      - { kind: open_rows, at: trip, highlight: [trip_id] }

  - text: "Its rows in `stop_times.txt`, the timetable: one row per stop each trip makes. There is one at most."
    actions:
      - { kind: open_rows,    at: calls, expect: any, highlight: [stop_sequence] }
      - { kind: map_sequence, trip: "{{tripId}}" }

fix:
  - "Add the missing stops of trip {{tripId}} to `stop_times.txt`, so it has at least two."
  - "If the trip no longer runs, remove line {{csvRowNumber}} from `trips.txt`."
