code: invalid_prior_notice_duration_min

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}", key: { booking_rule_id: "{{bookingRuleId}}" } }

steps:
  - text: "Booking rule {{bookingRuleId}} (line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip) asks riders to book at least {{priorNoticeDurationMin}} minutes before the trip, but no more than {{priorNoticeDurationMax}} minutes before. No booking can do both, so booking is never open."
    actions:
      - { kind: open_rows, at: rule, highlight: [prior_notice_duration_min, prior_notice_duration_max] }
      - { kind: show_record, at: rule, fields: [booking_type, prior_notice_duration_min, prior_notice_duration_max] }

fix:
  - "If the two were entered the wrong way round, set `prior_notice_duration_min` to {{priorNoticeDurationMax}} and `prior_notice_duration_max` to {{priorNoticeDurationMin}} for booking rule {{bookingRuleId}}."
  - "Otherwise, make `prior_notice_duration_max` at least {{priorNoticeDurationMin}}, or empty it if there is no earliest time to book."
