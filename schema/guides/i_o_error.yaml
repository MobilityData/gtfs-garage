code: i_o_error

steps:
  - text: "This is not a problem in the feed's data: the validator could not read or write a file it needed. The rest of the report may be incomplete."
    actions:
      - { kind: show_value, value: "{{message}}", label: "What the validator reported" }

fix:
  - "Run the validator again, after checking that the feed file opens and that there is enough disk space."
  - "If it happens again, report it to the gtfs-validator project on GitHub, with the message above and the error name {{exception}}."
