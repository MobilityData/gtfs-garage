code: attribution_without_role

locators:
  row: { file: attributions, line: "{{csvRowNumber}}", key: { attribution_id: "{{attributionId}}" } }

steps:
  - text: "Line {{csvRowNumber}} of `attributions.txt`, the organisations credited for the feed, credits {{attributionId}} without saying for what. `is_producer`, `is_operator` and `is_authority` are all 0 or empty, so apps cannot show its role."
    actions:
      - { kind: open_rows,   at: row, highlight: [is_producer, is_operator, is_authority] }
      - { kind: show_record, at: row, fields: [organization_name, is_producer, is_operator, is_authority] }

fix:
  - "Set `is_producer`, `is_operator` or `is_authority` to 1 for {{attributionId}}, for each role the organisation played."
  - "If it played none of these roles, remove the row."
