code: stop_time_with_only_arrival_or_departure_time

locators:
  row:   { file: stop_times, line: "{{csvRowNumber}}", key: { trip_id: "{{tripId}}", stop_sequence: "{{stopSequence}}" } }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Stop {{stopSequence}} of trip {{tripId}} has only one of its two times: `{{specifiedField}}` is filled in, the other is empty. A stop must have both times, or neither."
    actions:
      - { kind: open_rows, at: calls, mark: row, highlight: [arrival_time, departure_time] }

  - text: "The trip in its timetable. With one time missing, apps cannot tell when the vehicle arrives or leaves, and may drop the stop or the whole trip."
    actions:
      - { kind: timetable,   trip: "{{tripId}}" }
      - { kind: show_record, at: row, fields: [arrival_time, departure_time] }

fix:
  - "Fill in the empty time on line {{csvRowNumber}} of `stop_times.txt`; if the vehicle does not wait at the stop, copy the `{{specifiedField}}` value into it."
  - "If the time there is not known, leave both times empty and set `timepoint` to 0, so apps estimate it."
