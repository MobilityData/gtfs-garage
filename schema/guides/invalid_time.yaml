code: invalid_time

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}` the value \"{{fieldValue}}\", which is not a time. Apps cannot tell riders when the vehicle comes, and may drop the trip or reject the feed."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "06:00:00" }

  - text: "A time is written as hours, minutes and seconds with colons, on a 24-hour clock: 14:30:00 is 2:30 pm. Past midnight the hours keep counting, so 25:35:00 is 1:35 am the next morning."
    actions:
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Replace \"{{fieldValue}}\" in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` with the time written as HH:MM:SS, such as 06:00:00."
