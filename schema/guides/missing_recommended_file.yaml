code: missing_recommended_file

steps:
  - text: "The feed has no `{{filename}}`. GTFS does not require it but recommends it, and apps and data users rely on what it says."
    actions:
      - { kind: show_files, missing: ["{{filename}}"], mark: ["{{filename}}"] }

fix:
  - "Add `{{filename}}` to the feed."
  - "If the viewer lists `{{filename}}` but the validator did not find it, the files are probably in a folder inside the zip: zip the .txt files themselves, not their folder."
