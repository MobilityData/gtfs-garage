code: big_gap_in_service

locators:
  days: { file: calendar_dates, key: { service_id: "{{serviceId}}" } }

steps:
  - text: "Service {{serviceId}} has {{gapDurationDays|days}} with no trips at all, between {{gapStartDate|date}} and {{gapEndDate|date}}. A break of more than two weeks is often a mistake, such as a missing school term or a mistyped date."
    actions:
      - { kind: timeline, start: "{{gapStartDate}}", end: "{{gapEndDate}}", count: between, start_label: "Runs before the gap", end_label: "Runs again" }

  - text: "Service days, opened on {{gapStartDate|date}}. Look at the stretch after it where this service has no days."
    actions:
      - { kind: calendar, date: "{{gapStartDate}}" }

  - text: "These are the single days `calendar_dates.txt`, the list of days added to or removed from a service, gives {{serviceId}}. In `exception_type`, 1 adds a day and 2 removes one."
    actions:
      - { kind: open_rows, at: days, highlight: [date, exception_type] }

fix:
  - "If service {{serviceId}} should run between {{gapStartDate|date}} and {{gapEndDate|date}}, add those days in `calendar.txt` or as added days in `calendar_dates.txt`."
  - "If the break is real, for example a seasonal service, nothing needs to change."
