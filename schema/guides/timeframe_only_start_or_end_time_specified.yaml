code: timeframe_only_start_or_end_time_specified

locators:
  row: { file: timeframes, line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `timeframes.txt`, the times of day a fare applies, has a `start_time` or an `end_time` but not both. Apps cannot tell when the fare starts or stops applying."
    actions:
      - { kind: open_rows, at: row, highlight: [start_time, end_time] }
      - { kind: show_record, at: row }

fix:
  - "Fill in the missing `start_time` or `end_time` on line {{csvRowNumber}} of `timeframes.txt`."
  - "If the fare applies all day, empty both `start_time` and `end_time` on line {{csvRowNumber}}."
