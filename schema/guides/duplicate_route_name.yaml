code: duplicate_route_name

locators:
  route1: { file: routes, line: "{{csvRowNumber1}}", key: { route_id: "{{routeId1}}" } }
  route2: { file: routes, line: "{{csvRowNumber2}}", key: { route_id: "{{routeId2}}" } }
  both:   { file: routes, line: "{{csvRowNumber1}},{{csvRowNumber2}}" }
  trips1: { file: trips,  key: { route_id: "{{routeId1}}" } }
  trips2: { file: trips,  key: { route_id: "{{routeId2}}" } }

steps:
  - text: "Routes {{routeId1}} and {{routeId2}} in `routes.txt`, the list of routes, have the same name, agency and kind of vehicle. In an app's list of routes, riders see two they cannot tell apart."
    actions:
      - { kind: open_rows,       at: both, highlight: [route_short_name, route_long_name] }
      - { kind: compare_records, a: route1, b: route2, fields: [agency_id, route_short_name, route_long_name, route_type, route_color] }

  - text: "The trips of {{routeId1}}. `trip_headsign` is the destination shown on the vehicle: note where they go."
    actions:
      - { kind: open_rows, at: trips1, highlight: [trip_headsign, direction_id] }
      - { kind: map_focus, routes: ["{{routeId1}}"] }

  - text: "The trips of {{routeId2}}. If they run the same line the other way, they belong to route {{routeId1}}: both directions of a route are one route."
    actions:
      - { kind: open_rows, at: trips2, highlight: [trip_headsign, direction_id] }
      - { kind: map_focus, routes: ["{{routeId1}}", "{{routeId2}}"] }

fix:
  - "If {{routeId2}} is the other direction of {{routeId1}}, give its trips `route_id` {{routeId1}} and `direction_id` 1 in `trips.txt`, and remove route {{routeId2}}."
  - "If they really are different routes, give them names a rider can tell apart, for example a different `route_long_name`."
