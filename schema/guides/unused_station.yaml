code: unused_station

locators:
  station:  { file: stops, line: "{{csvRowNumber}}", key: { stop_id: "{{stopId}}" } }
  children: { file: stops, key: { parent_station: "{{stopId}}" } }

steps:
  - text: "{{stopName}} ({{stopId}}) is a station, the row that groups a station's platforms and entrances in `stops.txt`. But nothing belongs to it, so it groups nothing."
    actions:
      - { kind: open_rows, at: station, highlight: [location_type] }
      - { kind: map_focus, stops: ["{{stopId}}"] }

  - text: "No row of `stops.txt` has {{stopId}} as its `parent_station`. Vehicles stop at platforms, not stations, so riders cannot board at {{stopName}} as it stands."
    actions:
      - { kind: open_rows, at: children, expect: empty }

fix:
  - "If riders board at {{stopName}}, set the `parent_station` of its platforms to {{stopId}}."
  - "If vehicles stop right at {{stopName}}, make it a stop by setting its `location_type` to 0."
  - "If {{stopName}} is not used, delete line {{csvRowNumber}} of `stops.txt`."
