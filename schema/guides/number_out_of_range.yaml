code: number_out_of_range

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}` the value {{fieldValue|round}}, but it must be a {{fieldType}}. Apps cannot use a value outside that range, and may drop the row or reject the feed."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "45.5017" }

  - text: "A value just outside the range is often a typing slip or two columns swapped, such as a latitude and a longitude."
    actions:
      - { kind: show_record, at: row }

fix:
  - "Correct `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` to a value that is a {{fieldType}}."
  - "If the other values on the line look swapped too, put each back in its own column."
