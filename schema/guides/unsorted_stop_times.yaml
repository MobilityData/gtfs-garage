code: unsorted_stop_times

locators:
  ends:  { file: stop_times, line: "{{startCsvRowNumber}},{{endCsvRowNumber}}" }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "The stops of trip {{tripId}} run from line {{startCsvRowNumber}} to line {{endCsvRowNumber}} of `stop_times.txt`, the timetable, but not together in stop order: other rows sit between them, or they are shuffled."
    actions:
      - { kind: open_rows, at: ends, around: 2, highlight: [trip_id, stop_sequence] }

  - text: "The trip itself is fine, and most apps sort the rows. Some tools read the file in order, though, and are slower or misread a trip whose rows are scattered."
    actions:
      - { kind: open_rows,    at: calls, highlight: [stop_sequence] }
      - { kind: map_sequence, trip: "{{tripId}}" }

fix:
  - "Sort `stop_times.txt` by `trip_id`, then `stop_sequence`, so the rows of {{tripId}} sit together in stop order."
