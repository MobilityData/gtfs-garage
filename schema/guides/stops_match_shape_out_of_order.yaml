code: stops_match_shape_out_of_order

locators:
  pair:  { file: stop_times, line: "{{stopTimeCsvRowNumber2}},{{stopTimeCsvRowNumber1}}" }
  calls: { file: stop_times, key: { trip_id: "{{tripId}}" } }

steps:
  - text: "Trip {{tripId}} stops at {{stopName2}} and then at {{stopName1}}, but along its line, shape {{shapeId}}, {{stopName1}} comes first."
    point: map
    actions:
      - { kind: open_rows,    at: calls, mark: pair, highlight: [stop_id, stop_sequence] }
      - { kind: map_focus,    shapes: ["{{shapeId}}"], points: ["{{match1}}", "{{match2}}"] }
      - { kind: map_sequence, trip: "{{tripId}}", mark: ["{{stopId2}}", "{{stopId1}}"] }

  - text: "Played at its scheduled pace, the vehicle doubles back between {{stopName2}} and {{stopName1}}. Apps that follow it along the line show it jumping backwards."
    actions:
      - { kind: map_play, trip: "{{tripId}}", from: "{{stopId2}}", to: "{{stopId1}}", around: 1 }

fix:
  - "If the stops are in the wrong order, swap the `stop_sequence` values on lines {{stopTimeCsvRowNumber2}} and {{stopTimeCsvRowNumber1}} of `stop_times.txt`."
  - "If one of the stops is in the wrong place, correct `stop_lat` and `stop_lon` for {{stopId2}} or {{stopId1}} in `stops.txt`."
  - "If the line is wrong, redraw shape {{shapeId}} so it passes the stops in the order the trip serves them."
