code: equal_shape_distance_diff_coordinates

locators:
  shape: { file: shapes, key: { shape_id: "{{shapeId}}" } }
  prev:  { file: shapes, line: "{{prevCsvRowNumber}}", key: { shape_id: "{{shapeId}}", shape_pt_sequence: "{{prevShapePtSequence}}" } }
  point: { file: shapes, line: "{{csvRowNumber}}",     key: { shape_id: "{{shapeId}}", shape_pt_sequence: "{{shapePtSequence}}" } }
  pair:  { file: shapes, line: "{{prevCsvRowNumber}},{{csvRowNumber}}" }

steps:
  - text: "Points {{prevShapePtSequence}} and {{shapePtSequence}} of shape {{shapeId}}, a line trips are drawn with, are {{actualDistanceBetweenShapePoints|m}} apart, yet both are {{shapeDistTraveled|round}} along it. In `shapes.txt`, `shape_dist_traveled` says how far along the line each point is, so it must grow as the line moves on."
    actions:
      - { kind: open_rows, at: shape, mark: pair, highlight: [shape_pt_lat, shape_pt_lon, shape_dist_traveled] }
      - { kind: map_focus, shapes: ["{{shapeId}}"] }

  - text: "Side by side: different places, the same distance. Apps place stops and vehicles on the line by these distances, so along this stretch they put them in the wrong place."
    actions:
      - { kind: compare_records, a: prev, b: point, fields: [shape_pt_sequence, shape_pt_lat, shape_pt_lon, shape_dist_traveled] }
      - { kind: chart, at: shape, x: shape_pt_sequence, y: shape_dist_traveled, mark: ["{{prevCsvRowNumber}}", "{{csvRowNumber}}"] }

fix:
  - "Raise `shape_dist_traveled` of point {{shapePtSequence}} of shape {{shapeId}} above {{prevShapeDistTraveled|round}} by the {{actualDistanceBetweenShapePoints|m}} between the two points, in the unit the shape uses, and raise every later point by as much."
  - "If the distances cannot be trusted, leave `shape_dist_traveled` empty for the whole shape and for the trips that use it in `stop_times.txt`; apps then work the distances out themselves."
