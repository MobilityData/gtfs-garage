code: unsupported_feature_type

locators:
  zone: { file: locations, key: { id: "{{featureId}}" } }

steps:
  - text: "Zone {{featureId}} in `locations.geojson`, the file of zones that on-demand trips serve, gives its `type` as {{featureType}}. Every zone must say exactly Feature, or apps skip it."
    actions:
      - { kind: open_rows,  at: zone }
      - { kind: map_focus,  locations: ["{{featureId}}"] }
      - { kind: show_value, value: "{{featureType}}", label: "The zone's type", expect: "Feature" }

fix:
  - "In `locations.geojson`, change the `type` of zone {{featureId}} from {{featureType}} to Feature."
