code: future_feed

locators:
  feed: { file: feed_info }

steps:
  - text: "`feed_info.txt`, the feed's description of itself, says the feed starts on {{feedStartDate|date}}. It was checked on {{currentDate|date}}, so it covers only the future."
    actions:
      - { kind: open_rows, at: feed, highlight: [feed_start_date] }
      - { kind: timeline,  start: "{{currentDate}}", end: "{{feedStartDate}}", count: between, start_label: "Checked on", end_label: "Feed starts" }

fix:
  - "If this feed is published ahead of a new schedule, keep the current feed available until {{feedStartDate|date}}."
  - "If the feed should already be in use, correct `feed_start_date` in `feed_info.txt`."
