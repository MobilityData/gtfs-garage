code: equal_shape_distance_same_coordinates

locators:
  shape: { file: shapes, key: { shape_id: "{{shapeId}}" } }
  prev:  { file: shapes, line: "{{prevCsvRowNumber}}", key: { shape_id: "{{shapeId}}", shape_pt_sequence: "{{prevShapePtSequence}}" } }
  point: { file: shapes, line: "{{csvRowNumber}}",     key: { shape_id: "{{shapeId}}", shape_pt_sequence: "{{shapePtSequence}}" } }
  pair:  { file: shapes, line: "{{prevCsvRowNumber}},{{csvRowNumber}}" }

steps:
  - text: "Points {{prevShapePtSequence}} and {{shapePtSequence}} of shape {{shapeId}}, a line trips are drawn with, are the same point twice: same place, and both {{shapeDistTraveled|round}} along the line. In `shapes.txt`, `shape_dist_traveled` says how far along the line each point is."
    actions:
      - { kind: open_rows, at: shape, mark: pair, highlight: [shape_pt_lat, shape_pt_lon, shape_dist_traveled] }
      - { kind: map_focus, shapes: ["{{shapeId}}"] }

  - text: "Side by side, only the point number differs. The copy changes nothing on the map, but it makes the file longer and can confuse tools that expect each point to move the line on."
    actions:
      - { kind: compare_records, a: prev, b: point, fields: [shape_pt_sequence, shape_pt_lat, shape_pt_lon, shape_dist_traveled] }

fix:
  - "Remove line {{csvRowNumber}} of `shapes.txt`, the copy (point {{shapePtSequence}} of shape {{shapeId}})."
