code: foreign_key_violation

locators:
  child:  { file: "{{childFilename}}",  line: "{{csvRowNumber}}" }
  parent: { file: "{{parentFilename}}", key: { "{{parentFieldName}}": "{{fieldValue}}" } }

steps:
  - text: "Line {{csvRowNumber}} of `{{childFilename}}` points to `{{childFieldName}}` {{fieldValue}}, which is not in `{{parentFilename}}`. Apps cannot follow the link, so they may drop this row, or its whole trip."
    actions:
      - { kind: open_rows,  at: child, highlight: ["{{childFieldName}}"] }
      - { kind: show_model, files: ["{{childFilename}}", "{{parentFilename}}"], edge: { from: "{{childFilename}}.{{childFieldName}}", to: "{{parentFilename}}.{{parentFieldName}}" } }

  - text: "Searching `{{parentFilename}}` for `{{parentFieldName}}` {{fieldValue}} finds nothing."
    actions:
      - { kind: open_rows, at: parent, expect: empty }

fix:
  - "Add a row with `{{parentFieldName}}` {{fieldValue}} to `{{parentFilename}}`."
  - "If line {{csvRowNumber}} is the one that is wrong, change its `{{childFieldName}}` to one that exists; a typo or a space at the end is the usual cause."
