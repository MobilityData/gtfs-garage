code: empty_row

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` holds nothing but spaces. Some apps read it as a row with every value empty, and then report that row as broken."
    actions:
      - { kind: open_rows, at: row, around: 2 }

fix:
  - "Delete line {{csvRowNumber}} of `{{filename}}` in a text editor."
