code: leading_or_trailing_whitespaces

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` has a space at the start or the end of `{{fieldName}}`: \"{{fieldValue}}\". The marks below show where."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "Main Street" }

  - text: "The validator removes such spaces before it checks anything, but other apps may not: text can show out of line, and an id with a space no longer matches the same id written without one."
    actions:
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Remove the space at the start or end of `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}`."
  - "Check the export trims values, since one space usually means others: a tool that adds quotes around values often keeps spaces inside them."
