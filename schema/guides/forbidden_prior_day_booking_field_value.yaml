code: forbidden_prior_day_booking_field_value

locators:
  rule: { file: booking_rules, line: "{{csvRowNumber}}", key: { booking_rule_id: "{{bookingRuleId}}" } }

steps:
  - text: "Booking rule {{bookingRuleId}} (line {{csvRowNumber}} of `booking_rules.txt`, how and when riders must book a trip) is for trips booked one or more days before (`booking_type` 2). Yet it also fills in `{{fieldNames}}`, used only for trips booked the same day."
    actions:
      - { kind: open_rows, at: rule, highlight: [booking_type, "{{fieldNames}}"] }

  - text: "A deadline days ahead is a day and a time (`prior_notice_last_day`, `prior_notice_last_time`). With a number of minutes as well, an app cannot tell riders which deadline is true."
    actions:
      - { kind: show_record, at: rule, fields: [booking_type, prior_notice_last_day, prior_notice_last_time, "{{fieldNames}}"] }

fix:
  - "Empty `{{fieldNames}}` for booking rule {{bookingRuleId}}, and keep the deadline in `prior_notice_last_day` and `prior_notice_last_time`."
  - "If riders actually book the same day, set `booking_type` to 1 and empty the `prior_notice_last_` and `prior_notice_start_` columns instead."
