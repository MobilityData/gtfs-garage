code: invalid_currency

locators:
  row: { file: "{{filename}}", line: "{{csvRowNumber}}" }

steps:
  - text: "Line {{csvRowNumber}} of `{{filename}}` gives `{{fieldName}}`, the currency of the price, the value \"{{fieldValue}}\", which is not a currency code. Apps cannot tell riders what the fare costs without knowing its currency."
    actions:
      - { kind: open_rows,  at: row, highlight: ["{{fieldName}}"] }
      - { kind: show_value, value: "{{fieldValue}}", label: "{{fieldName}}, as the feed has it", expect: "CAD" }

  - text: "A currency is written as its three-letter international code (ISO 4217): CAD for Canadian dollars, USD for US dollars, EUR for euros, JPY for Japanese yen."
    actions:
      - { kind: show_record, at: row, fields: ["{{fieldName}}"] }

fix:
  - "Replace \"{{fieldValue}}\" in `{{fieldName}}` on line {{csvRowNumber}} of `{{filename}}` with the three-letter code of the fare's currency, such as CAD, USD or EUR."
