code: overlapping_zone_and_pickup_drop_off_window

locators:
  trip:   { file: stop_times, key: { trip_id: "{{tripId}}" } }
  first:  { file: stop_times, key: { trip_id: "{{tripId}}", stop_sequence: "{{stopSequence1}}" } }
  second: { file: stop_times, key: { trip_id: "{{tripId}}", stop_sequence: "{{stopSequence2}}" } }

steps:
  - text: "Trip {{tripId}} is a flex trip: it serves a zone or a time window, booked in advance, rather than fixed stops at fixed times. Two of its rows in `stop_times.txt`, the timetable, serve zones {{locationId1}} and {{locationId2}}, and the zones overlap."
    point: map
    actions:
      - { kind: open_rows, at: trip, highlight: [location_id, start_pickup_drop_off_window, end_pickup_drop_off_window, pickup_type, drop_off_type] }
      - { kind: map_focus, locations: ["{{locationId1}}", "{{locationId2}}"] }

  - text: "Their times overlap too: {{startPickupDropOffWindow1}} to {{endPickupDropOffWindow1}}, and {{startPickupDropOffWindow2}} to {{endPickupDropOffWindow2}}. Both rows allow the same kind of pickup or drop-off, so a rider in the shared area at the shared time matches both, and apps cannot tell which one applies."
    actions:
      - { kind: timeline, start: "{{startPickupDropOffWindow1}}", end: "{{endPickupDropOffWindow1}}", start_label: "{{locationId1}} opens", end_label: "{{locationId1}} closes", other_start: "{{startPickupDropOffWindow2}}", other_end: "{{endPickupDropOffWindow2}}", other_label: "{{locationId2}}", count: none }
      - { kind: compare_records, a: first, b: second, fields: [location_id, stop_sequence, start_pickup_drop_off_window, end_pickup_drop_off_window, pickup_type, drop_off_type] }

fix:
  - "Redraw zones {{locationId1}} and {{locationId2}} in `locations.geojson` so they no longer overlap, or change the windows of trip {{tripId}} so they no longer share any time."
  - "If both rows describe the same service, merge them into one row with one zone and one window."
