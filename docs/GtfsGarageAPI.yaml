openapi: 3.0.3
info:
  version: 1.0.0
  title: GTFS Garage API
  description: |
    The contract between a GTFS Garage viewer and whatever feeds it.

    This document is the source of truth. The server's pydantic models and the
    viewer's TypeScript types are both generated from it.

    A host embedding `gtfs-garage-web` has three options, and only the second
    needs this document in full:

    1. Point the viewer at a GTFS Garage server, which implements everything here.
    2. Implement these endpoints on your own backend. The viewer's `RestSource`
       then drives it unchanged.
    3. Implement the browser-side `ViewerSource` interface instead, which is not
       an HTTP contract and is described in `docs/INTEGRATION.md`.

    Two things this document deliberately does not settle, because they are the
    host's to decide and a GTFS Garage server needs neither:

    - **CORS.** A GTFS Garage server serves the viewer from its own origin and
      adds no CORS middleware. A host serving these endpoints to a page on
      another origin must send the usual headers itself.
    - **Authentication.** `RestSource` sets no request header and no
      `credentials` option, so a same-origin session cookie is sent by
      `fetch`'s own default and nothing else is. A bearer token, or a cookie on
      a cross-origin request, cannot be reached by pointing `baseUrl` at the
      backend; implement `ViewerSource` instead.

    See `docs/INTEGRATION.md` for embedding the viewer, and the `DatasetManifest`
    schema below for the Parquet layout a static host serves.
  # No `email`: openapi-generator prints `Contact: <email>` into the header of
  # all 34 generated model files, and the URL below is the address that is
  # actually maintained.
  contact:
    name: MobilityData
    url: https://mobilitydata.org/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:8811
    description: A GTFS Garage server started by the `gtfs-garage` command.
tags:
  - name: feed
    description: >-
      The loaded feed: what it contains, and what it cost to open. A GTFS Garage
      server holds exactly one feed at a time, so none of these paths name it.
  - name: table
    description: >-
      Rows of one GTFS table, filtered and paged. Every value is text: the loader
      reads all columns as VARCHAR so a feed with a malformed number still opens.
  - name: map
    description: >-
      The feed's geometry as GeoJSON. A whole layer streams as newline-delimited
      JSON, because a large feed's shapes run to hundreds of megabytes and cannot
      be transferred or parsed in one piece.
  - name: workspace
    description: |-
      The directory a GTFS Garage server writes into: what it holds, what that
      weighs, and how to empty it.

      **A host embedding the viewer does not implement these.** They describe a
      local process's own disk, which a hosted backend has no equivalent of. The
      viewer only calls them when `GET /api/config` reports `workspace: true`,
      and the interface they drive is simply absent otherwise.

paths:
  /api/config:
    get:
      summary: Settings the interface reads at startup
      description: >-
        Read once before the viewer draws, so that a basemap chosen server-side
        reaches the page. A host that passes its own `basemap` never calls this,
        which is why the viewer treats a failure here as "no preference" rather
        than an error.
      operationId: getConfig
      tags: [feed]
      responses:
        "200":
          description: The server's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"

  /api/tables:
    get:
      summary: What the loaded feed contains
      description: >-
        Every table with its row count and its columns, the files GTFS says are
        missing, and what the load cost. This is the viewer's first request and
        the one that populates the sidebar.
      operationId: getTables
      tags: [feed]
      responses:
        "200":
          description: The feed's tables.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablesResponse"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/table/{table}:
    parameters:
      - $ref: "#/components/parameters/table_path_param"
    get:
      summary: One page of a table
      description: >-
        Rows matching the filters, one page at a time. `total` counts every
        matching row, not the page, so the viewer can draw the pager without a
        second request.
      operationId: getTable
      tags: [table]
      parameters:
        - name: page
          in: query
          description: 1-based page number.
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Rows per page.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: filters
          in: query
          description: >-
            A JSON array of `Filter` objects, URL-encoded. Empty array means no
            filtering. Not a repeated parameter: the value is one JSON document,
            because a filter is an object and query parameters are strings.
          required: false
          schema:
            type: string
            default: "[]"
          example: '[{"column":"route_id","op":"eq","value":"R1"}]'
      responses:
        "200":
          description: The requested page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "400":
          description: >-
            `filters` was not valid JSON, or was valid JSON that is not an array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The feed has no such table.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/table/{table}/distinct/{column}:
    parameters:
      - $ref: "#/components/parameters/table_path_param"
      - name: column
        in: path
        description: The column to count values of.
        required: true
        schema:
          type: string
        example: route_type
    get:
      summary: The values a column actually holds, with counts
      description: >-
        What fills the picklist the filter builder offers for an enumerated
        column. Ordered by count, descending, so the common values come first.
      operationId: getDistinctValues
      tags: [table]
      parameters:
        - name: limit
          in: query
          description: >-
            Most values to return. A column with more distinct values than this
            is truncated rather than refused.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: The values present, most frequent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DistinctResponse"
        "404":
          description: The feed has no such table, or that table has no such column.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/geojson/stops:
    get:
      summary: Stops, as points
      description: >-
        With `stop_ids`, the named stops as one document, which is how the viewer
        highlights a row. Without, the whole layer as a stream. Stops are never
        thinned at any feed size: a stop is one point, so half a million of them
        cost far less than the lines do.
      operationId: getStopsGeojson
      tags: [map]
      parameters:
        - name: stop_ids
          in: query
          description: >-
            Repeat the parameter per id. Never comma-joined: a GTFS id may
            contain a comma, which a delimiter would split into two ids matching
            nothing.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/GeoJsonLayer"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/geojson/shapes:
    get:
      summary: Shapes, as lines
      description: >-
        With `shape_ids`, the named shapes as one document. Without, every shape
        the routes layer does not already draw, as a stream. Highlighting a route
        goes through this path too, with the route's representative `shape_id`.
      operationId: getShapesGeojson
      tags: [map]
      parameters:
        - name: shape_ids
          in: query
          description: Repeat the parameter per id. See `stop_ids`.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/GeoJsonLayer"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/geojson/locations:
    get:
      summary: A flex feed's on-demand zones, as polygons
      description: >-
        Drawn from the feed's own `locations.geojson`, whose geometry is passed
        through verbatim. A feed without that file streams a `total` of 0 and
        draws nothing, exactly as a feed without `shapes.txt` already does.
      operationId: getLocationsGeojson
      tags: [map]
      parameters:
        - name: location_ids
          in: query
          description: Repeat the parameter per id. See `stop_ids`.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/GeoJsonLayer"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/geojson/routes:
    get:
      summary: One representative line per route, coloured by the feed
      description: >-
        Streamed only - there is no id-filtered form, because a route is
        highlighted through its shape on `/api/geojson/shapes`. Each feature
        carries the route's own `route_color`, defaulting to `3388ff`.
      operationId: getRoutesGeojson
      tags: [map]
      responses:
        "200":
          description: The layer, as a newline-delimited JSON stream.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/NdjsonLine"
        "409":
          $ref: "#/components/responses/NoFeedLoaded"

  /api/load/progress:
    get:
      summary: Where a running load has got to
      description: >-
        Safe to poll, and answered even when nothing is loading - `running` is
        then false. The viewer polls this while a feed opens so it can say
        "Converting stop_times (12 of 32)" rather than showing a blank page.
      operationId: getLoadProgress
      tags: [feed]
      responses:
        "200":
          description: The current reading.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoadProgress"

  /api/load:
    post:
      summary: Open a feed
      description: |
        Implemented by a GTFS Garage server, which browses whatever feed you hand
        it. **A host embedding the viewer normally does not implement this**: an
        embedded viewer is built without the load dialog, so nothing calls it.

        Exactly one source is used, in this order of precedence: uploaded
        `files`, an uploaded `file`, `url`, then `path`. A download is capped at
        2 GiB and 60 seconds, and only `http`/`https` are accepted.

        Replacing the loaded feed does not disturb requests already in flight
        against the previous one; it is released when its last reader finishes.
      operationId: loadFeed
      tags: [feed]
      parameters:
        - name: path
          in: query
          description: A path on the server's own filesystem - a `.zip` or a folder.
          required: false
          schema:
            type: string
        - name: url
          in: query
          description: A URL for the server to download.
          required: false
          schema:
            type: string
            format: uri
        - name: name
          in: query
          description: >-
            What to call a feed uploaded as loose files, which arrive without a
            container to take a name from.
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/LoadFeedUpload"
      responses:
        "200":
          description: The feed, described as `GET /api/tables` would describe it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablesResponse"
        "400":
          description: >-
            No source was supplied, or the feed could not be opened - a download
            that failed, an archive with no GTFS files in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/workspace:
    get:
      summary: What the server has written to disk
      description: >-
        The workdir's path, whether it survives the process, how many feeds it
        keeps, and a row per feed it holds. The totals are measured from the
        directory rather than remembered, so they describe what is actually
        there.
      operationId: getWorkspace
      tags: [workspace]
      responses:
        "200":
          description: The workdir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
    delete:
      summary: Empty the workdir
      description: >-
        Removes every feed whose files are not open. The feed being served is
        never removed - its Parquet is what every query reads - so emptying a
        workdir while browsing leaves exactly that one behind.
      operationId: clearWorkspace
      tags: [workspace]
      responses:
        "200":
          description: The workdir, as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"

  /api/workspace/feeds/{feed_id}:
    parameters:
      - $ref: "#/components/parameters/feed_id_path_param"
    delete:
      summary: Delete one feed's files
      description: >-
        Refused with 409 while that feed is the one being served, or while a
        request is still reading it.
      operationId: removeWorkspaceFeed
      tags: [workspace]
      responses:
        "200":
          description: The workdir, as it now stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResponse"
        "404":
          description: No such feed in the workdir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: That feed is open, so its files cannot be removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/workspace/feeds/{feed_id}/reload:
    parameters:
      - $ref: "#/components/parameters/feed_id_path_param"
    post:
      summary: Serve a feed the workdir already holds
      description: >-
        Reopens the feed from the Parquet it was converted to at its first load,
        so there is nothing to download, unzip or convert. Replacing the loaded
        feed behaves exactly as `POST /api/load` does, in-flight requests
        included.
      operationId: reloadWorkspaceFeed
      tags: [workspace]
      responses:
        "200":
          description: The feed, described as `GET /api/tables` would describe it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TablesResponse"
        "404":
          description: >-
            No such feed in the workdir, or one with no Parquet to reopen - a
            feed loaded with `--no-parquet`, or a load that was interrupted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    feed_id_path_param:
      name: feed_id
      in: path
      description: A feed's id in the workdir, as `GET /api/workspace` reports it.
      required: true
      schema:
        type: string
      example: montreal-gtfs-zip-7f3a91c0
    table_path_param:
      name: table
      in: path
      description: >-
        The table name, which is the GTFS file stem - `stops` for `stops.txt`.
        `locations` is the flattened form of `locations.geojson`.
      required: true
      schema:
        type: string
      example: stop_times

  responses:
    NoFeedLoaded:
      description: >-
        No feed is loaded. A GTFS Garage server started without one answers this
        until `POST /api/load` succeeds; a host that always has a feed never
        returns it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GeoJsonLayer:
      description: >-
        One `FeatureCollection` when ids were given, or the whole layer as a
        newline-delimited JSON stream when they were not. The two are
        distinguished by content type, not by a field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FeatureCollection"
        application/x-ndjson:
          schema:
            $ref: "#/components/schemas/NdjsonLine"

  schemas:
    Error:
      type: object
      description: >-
        Every error. The viewer reads `detail` and nothing else, and shows it to
        the user, so it should say what went wrong in words a reader can act on.
      required: [detail]
      properties:
        detail:
          type: string
          example: No GTFS feed loaded yet.

    ConfigResponse:
      type: object
      description: Settings the interface reads at startup.
      required: [basemap, version]
      properties:
        basemap:
          type: string
          description: >-
            A preset name (`openfreemap`, `esri`, `osm`, `carto`, `none`), a
            raster tile template containing `{z}/{x}/{y}`, or a vector style URL.
            The viewer resolves it.
          example: openfreemap
        version:
          type: string
          description: The version of GTFS Garage serving this API.
          example: 1.4.2
        workspace:
          type: boolean
          description: >-
            Whether this server manages a workdir and so answers the `workspace`
            paths. Absent or false means it does not, and the viewer builds no
            interface for one.
          example: true

    WorkspaceFeed:
      type: object
      description: One feed the workdir holds.
      required: [id, label, bytes, tables, reloadable, current]
      properties:
        id:
          type: string
          description: >-
            The directory the feed occupies, derived from its label so that
            loading the same feed twice reuses one slot rather than two.
          example: montreal-gtfs-zip-7f3a91c0
        label:
          type: string
          description: What the feed was loaded as - a filename, a path, or a URL.
          example: montreal-gtfs.zip
        kind:
          type: string
          description: How it was obtained.
          enum: [path, upload, folder, download]
        loaded_at:
          type: string
          format: date-time
          description: When it was last loaded.
        bytes:
          type: integer
          format: int64
          description: What the feed occupies in the workdir, measured from disk.
        tables:
          type: integer
          description: How many tables it holds.
        reloadable:
          type: boolean
          description: >-
            Whether there is Parquet to reopen it from. False for a feed loaded
            with `--no-parquet`, and for a load that did not finish.
        current:
          type: boolean
          description: Whether this is the feed being served.

    WorkspaceResponse:
      type: object
      description: The directory a GTFS Garage server writes into.
      required: [path, persistent, keep, total_bytes, feeds]
      properties:
        path:
          type: string
          description: The workdir's absolute path on the server's filesystem.
          example: /Users/sam/gtfs-work
        persistent:
          type: boolean
          description: >-
            Whether it survives the process. True when the server was started
            with `--workdir`; false for the per-run directory used otherwise,
            which is removed on exit.
        keep:
          type: integer
          description: >-
            How many feeds are kept before the oldest is dropped. 0 means none
            are ever dropped.
          example: 3
        total_bytes:
          type: integer
          format: int64
          description: What the whole workdir occupies.
        feeds:
          type: array
          description: The feeds it holds, most recently loaded first.
          items:
            $ref: "#/components/schemas/WorkspaceFeed"

    RelatedLink:
      type: object
      description: A table that points back at the current row's id.
      required: [table, column]
      properties:
        table:
          type: string
          example: trips
        column:
          type: string
          example: route_id

    ImpliedValue:
      type: object
      description: >-
        What GTFS says an empty value means for this field. The viewer draws the
        implied value muted and italic, and hides it under the raw-values toggle,
        because raw means the characters the file holds and here it holds none.
      required: [label]
      properties:
        code:
          type: string
          nullable: true
          description: >-
            One of the field's own enum codes. Null where the implied meaning has
            no code, as for `fare_attributes.transfers`, whose empty value means
            unlimited transfers.
          example: "0"
        label:
          type: string
          example: Regularly scheduled pickup

    ConditionOutcome:
      type: object
      description: >-
        Whether a feed-scope condition holds in the feed now loaded. `evidence`
        is what the check counted to decide, so the answer can be read back
        rather than trusted.
      required: [holds, evidence]
      properties:
        holds:
          type: boolean
        evidence:
          type: string
          example: agency.txt has 3 rows

    ColumnInfo:
      type: object
      description: >-
        One column, with everything GTFS says about the field it holds. The
        viewer formats values, offers picklists and draws foreign keys as links
        from this alone, so a host supplying its own columns decides how much of
        the schema the interface can show.
      required: [name]
      properties:
        name:
          type: string
          example: route_id
        fk_table:
          type: string
          nullable: true
          description: >-
            Set only when the referenced table and column exist in **this** feed.
            Most GTFS files are optional, so a link is never offered to a file
            the feed does not have.
          example: routes
        fk_column:
          type: string
          nullable: true
          example: route_id
        enum_like:
          type: boolean
          default: false
          description: >-
            GTFS defines a small fixed value set for this column, so the filter
            builder offers the values actually present with their counts.
        related:
          type: array
          description: >-
            Tables pointing back at this column, offered as the reverse
            direction - from a route straight to the trips that use it. Always
            present; empty unless this column is its table's primary id.
          default: []
          items:
            $ref: "#/components/schemas/RelatedLink"
        type:
          type: string
          nullable: true
          description: >-
            What GTFS says the field holds - `ID`, `ENUM`, `COLOR`, `LATITUDE`,
            `DATE` and so on. Null for a column the schema does not describe,
            such as a producer's own extension, which renders as text.
          example: ID
        values:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: For an enumeration, its codes and their labels; null otherwise.
        required:
          type: string
          nullable: true
          enum: [always, conditional]
          description: Null where GTFS makes the field optional.
        condition:
          type: string
          nullable: true
          description: >-
            For a conditionally required field, the condition in words. Null
            otherwise.
          example: Required if route_long_name is empty.
        condition_scope:
          type: string
          nullable: true
          enum: [row, feed, row_context]
          description: >-
            What settles the condition. `row` where the row does, `feed` where
            the feed as a whole does - and then `condition_outcome` carries the
            answer - and `row_context` where it varies row by row on something
            the row does not carry. Null unless the field is conditional.
        # The answer for this feed, for a `feed` scope. Null for any other
        # scope, and null when the check could not run.
        condition_outcome:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConditionOutcome"
        # What an empty value implies, where GTFS defines it.
        when_empty:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImpliedValue"
        pattern:
          type: string
          nullable: true
          description: >-
            What a value of this field's type must look like. Applied by the
            viewer before any formatting, compiled once and cached - a feed can
            have sixty million rows - and skipped rather than thrown if it will
            not compile, because no value may ever be blanked. Must mean the same
            thing in Python and JavaScript.
          example: "^[0-9A-Fa-f]{6}$"
        minimum:
          type: number
          nullable: true
        maximum:
          type: number
          nullable: true
        type_description:
          type: string
          nullable: true
          description: GTFS's own definition of the type, for when a value does not match it.

    FileCondition:
      type: object
      description: >-
        Why GTFS says this feed should not contain this file. The counterpart to
        `MissingFile`: that one is absent and needed, this one present and not
        wanted.
      required: [condition, outcome]
      properties:
        condition:
          type: string
        outcome:
          $ref: "#/components/schemas/ConditionOutcome"

    MissingFile:
      type: object
      description: >-
        A file the feed does not have and needs - required, or conditionally
        required with the condition holding here. Files it merely could have are
        not listed: a feed is normally without twenty optional files, and
        reporting those would bury the ones that matter.
      required: [name, presence]
      properties:
        name:
          type: string
          example: calendar
        presence:
          type: string
          enum: [required, conditional]
        condition:
          type: string
          nullable: true
          description: For a conditional file, the condition in words.
        # Why the condition holds here.
        condition_outcome:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ConditionOutcome"

    TableInfo:
      type: object
      required: [name, row_count, columns]
      properties:
        name:
          type: string
          example: stops
        row_count:
          type: integer
          format: int64
          example: 4821
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ColumnInfo"
        # Set only where GTFS forbids this file and the condition holds here.
        forbidden:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FileCondition"

    FileMetrics:
      type: object
      description: What one file cost to open.
      required: [name, table, bytes, register_ms, columns]
      properties:
        name:
          type: string
          example: stops.txt
        table:
          type: string
          example: stops
        bytes:
          type: integer
          format: int64
          description: Uncompressed size on disk.
        compressed_bytes:
          type: integer
          format: int64
          nullable: true
          description: Only for a zip source; a folder has no compressed form.
        register_ms:
          type: number
          description: >-
            Declaring the view, which resolves the column list off the start of
            the file and reads no further - so it barely varies with size. The
            interface labels it "read headers".
        convert_ms:
          type: number
          nullable: true
          description: Rewriting this table as Parquet; null when it was not converted.
        parquet_bytes:
          type: integer
          format: int64
          nullable: true
          description: What the table occupies once converted, typically far below `bytes`.
        count_ms:
          type: number
          nullable: true
          description: The row count. Near zero on Parquet, which carries it in the footer.
        row_count:
          type: integer
          format: int64
          nullable: true
        columns:
          type: integer

    LoadPhase:
      type: string
      description: >-
        The steps of a load, in the order they happen. A source that did not
        perform one of them never reports it.
      enum: [start, download, upload, extract, convert, summarise, done]

    LoadPhaseTiming:
      type: object
      description: One phase a non-server source performed, named in its own terms.
      required: [label, ms]
      properties:
        label:
          type: string
          example: Start DuckDB
        ms:
          type: number
        note:
          type: string
          description: A detail shown beside the timing.
          example: 412 kB fetched

    LoadMetrics:
      type: object
      description: |
        What the feed cost to open.

        Two mutually exclusive shapes. A server load reports `kind` and the
        timings below it. A source that performed no server load - a browser
        reading Parquet over range requests never downloads, unzips or converts -
        reports `phases` instead and omits the rest. A zero would say the work
        took no time rather than that it did not happen, which is why the fields
        are absent rather than zeroed.
      required: [total_ms, total_bytes, files]
      properties:
        phases:
          type: array
          description: >-
            Phases this source actually performed. Present only for a source that
            is not a server load.
          items:
            $ref: "#/components/schemas/LoadPhaseTiming"
        kind:
          type: string
          enum: [path, upload, folder, download]
          description: How the feed reached the server. Absent for a non-server source.
        acquire_ms:
          type: number
          nullable: true
          description: Downloading or receiving the upload; null for a local path.
        acquire_bytes:
          type: integer
          format: int64
          nullable: true
        extract_ms:
          type: number
          nullable: true
          description: Unzipping; null when the source was already-extracted files.
        register_ms:
          type: number
        convert_ms:
          type: number
          nullable: true
          description: Converting to Parquet; null when it was not converted.
        count_ms:
          type: number
        total_ms:
          type: number
          description: The phases added together.
        total_bytes:
          type: integer
          format: int64
          description: The archive's size, or the sum of the files in a folder.
        stored_bytes:
          type: integer
          format: int64
          nullable: true
          description: What the feed occupies to query once converted; null when it was not.
        files:
          type: array
          items:
            $ref: "#/components/schemas/FileMetrics"

    LoadProgress:
      type: object
      description: >-
        Where a running load has got to. The same shape reports a dataset being
        prepared elsewhere, which is why a host implementing that path can reuse
        it rather than inventing its own wording.
      required: [phase, done, total, detail, running]
      properties:
        phase:
          $ref: "#/components/schemas/LoadPhase"
        done:
          type: integer
          format: int64
          description: >-
            Progress within the current phase: **bytes** during `download`, and a
            count of files or tables otherwise.
        total:
          type: integer
          format: int64
          description: >-
            What `done` is counting towards, in the same unit, or 0 when it is
            not knowable in advance - a download whose response carries no
            Content-Length, for instance.
        detail:
          type: string
          description: The file or table being worked on; empty when there is none.
          example: stop_times
        running:
          type: boolean
          description: >-
            False when nothing is loading, which is an ordinary answer rather
            than an error.

    TablesResponse:
      type: object
      required: [source, tables]
      properties:
        source:
          type: string
          description: What to call this feed in the header.
          example: mdb-1210.zip
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableInfo"
        missing:
          type: array
          description: >-
            Files absent from this feed that GTFS says it needs. Empty for a
            complete feed, which is the usual case.
          default: []
          items:
            $ref: "#/components/schemas/MissingFile"
        # What the feed cost to open. A GTFS Garage server always sends this.
        # Optional because a source with no load to report omits it, and the
        # viewer then draws no load report rather than an empty one.
        metrics:
          $ref: "#/components/schemas/LoadMetrics"

    PageResponse:
      type: object
      required: [columns, rows, total, page, page_size]
      properties:
        columns:
          type: array
          description: The table's columns, in the order the rows carry them.
          items:
            type: string
        rows:
          type: array
          description: >-
            One array of values per row, aligned with `columns`. **Every value is
            a string or null** - the loader reads all columns as text so a feed
            with a malformed number still opens, and the viewer formats from the
            schema. A number here would be formatted as one it did not ask for.
          items:
            type: array
            items:
              type: string
              nullable: true
        total:
          type: integer
          format: int64
          description: Rows matching the filters, not rows on this page.
        page:
          type: integer
        page_size:
          type: integer

    ValueCount:
      type: object
      required: [count]
      properties:
        value:
          type: string
          nullable: true
          description: Null means the field is empty in the feed.
        count:
          type: integer
          format: int64

    DistinctResponse:
      type: object
      required: [values]
      properties:
        values:
          type: array
          items:
            $ref: "#/components/schemas/ValueCount"

    FilterOperator:
      type: string
      description: |
        How a filter compares. The semantics are not obvious and a
        reimplementation that differs will look right and behave wrongly:

        - `eq` / `ne` - equality. **An empty value is rewritten** to `is_empty` /
          `is_not_empty`, because an empty field loads as NULL and `= ''` would
          match nothing. Get this wrong and the "(empty)" entry in a picklist
          reports a count and then returns no rows.
        - `contains` - case-insensitive substring.
        - `in` - the value is a comma-separated list, trimmed, with empties
          dropped. If nothing remains the filter is skipped entirely.
        - `is_empty` / `is_not_empty` - NULL **or** the empty string, both.

        A filter naming a column the table does not have, or an operator not
        listed here, is ignored rather than refused.
      enum: [eq, ne, contains, in, is_empty, is_not_empty]

    Filter:
      type: object
      description: One condition on a column. Filters combine with AND.
      required: [column, op]
      properties:
        column:
          type: string
          description: >-
            Checked against the table's real columns and never interpolated into
            SQL.
          example: route_id
        op:
          $ref: "#/components/schemas/FilterOperator"
        value:
          type: string
          description: >-
            Absent or empty for `is_empty` and `is_not_empty`. For `in`, a
            comma-separated list.
          example: R1

    Geometry:
      type: object
      description: A GeoJSON geometry. Null for a feature that has none.
      required: [type, coordinates]
      properties:
        type:
          type: string
          example: Point
        coordinates:
          description: >-
            Nested arrays of numbers, shaped by `type`. Coordinates are rounded
            to five decimal places, which is about a metre.

    # The four discriminators below are named schemas rather than an inline
    # `enum` with one value, which is what they read as. openapi-generator emits
    # an inline single-value enum as `if value not in ('Feature')` - membership
    # in a string, not in a tuple - so every prefix of the value passes and the
    # discriminator validates nothing. A named schema generates a real enum
    # class instead, which is the whole point of publishing them.

    FeatureType:
      type: string
      enum: [Feature]

    FeatureCollectionType:
      type: string
      enum: [FeatureCollection]

    NdjsonHeaderType:
      type: string
      enum: [header]

    NdjsonBatchType:
      type: string
      enum: [batch]

    Feature:
      type: object
      description: |
        A GeoJSON feature. Which properties it carries depends on the layer, and
        the sets are deliberately minimal - one unread property is a string per
        stop, and a feed has hundreds of thousands:

        - stops: `stop_id`, `stop_name`
        - shapes: `shape_id`
        - routes: `shape_id`, `route_id`, `route_short_name`, `route_long_name`,
          `route_color`, `route_type`
        - locations: `location_id`, `stop_name`
      required: [type, geometry, properties]
      properties:
        type:
          $ref: "#/components/schemas/FeatureType"
        # Null for a feature that has none.
        geometry:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Geometry"
        properties:
          type: object
          additionalProperties:
            type: string

    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type:
          $ref: "#/components/schemas/FeatureCollectionType"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"

    NdjsonHeader:
      type: object
      description: The first line of a streamed layer, before any features.
      required: [type, total, step]
      properties:
        type:
          $ref: "#/components/schemas/NdjsonHeaderType"
        total:
          type: integer
          format: int64
          description: Features the whole layer will contain.
        step:
          type: integer
          description: >-
            The thinning factor applied to this layer's geometry: every `step`-th
            vertex was kept. `1` means the layer is drawn exactly. Above 1 the
            viewer says the map was simplified, so a coarse line is never passed
            off as the feed's own geometry.

    NdjsonBatch:
      type: object
      description: One batch of features. Any number follow the header.
      required: [type, features]
      properties:
        type:
          $ref: "#/components/schemas/NdjsonBatchType"
        features:
          type: array
          items:
            $ref: "#/components/schemas/Feature"

    NdjsonLine:
      description: |
        One line of an `application/x-ndjson` layer stream: a header, then any
        number of batches, each a complete JSON document followed by `\n`.

        A whole layer is far too large to wait for in one piece - a large feed is
        about 411 MB of GeoJSON - so it is sent as it is read and the map paints
        as it arrives. A reader must buffer across chunk boundaries, which fall
        wherever the network puts them and almost never on a newline, and should
        skip a line that will not parse rather than abandoning the layer.
      oneOf:
        - $ref: "#/components/schemas/NdjsonHeader"
        - $ref: "#/components/schemas/NdjsonBatch"

    LoadFeedUpload:
      type: object
      description: An uploaded feed. Use `file` for an archive, `files` for a folder.
      properties:
        file:
          type: string
          format: binary
          description: A `.zip` archive.
        files:
          type: array
          description: The `.txt` files of an extracted feed, uploaded together.
          items:
            type: string
            format: binary

    ManifestTable:
      type: object
      description: One table of an exported dataset.
      required: [name]
      properties:
        name:
          type: string
          description: The GTFS file stem - `stops` for `stops.txt`.
          example: stops
        file:
          type: string
          description: The Parquet file, relative to the manifest.
          example: stops.parquet
        rows:
          type: integer
          format: int64
        columns:
          type: integer
        bytes:
          type: integer
          format: int64
          nullable: true
          description: >-
            **Version 2**: what the source file weighed before conversion.
            **Version 1**: the Parquet size instead - the same key meaning two
            things, which is why a reader must branch on `version`.
        compressed_bytes:
          type: integer
          format: int64
          nullable: true
          description: The size inside the archive; null for a folder source.
        parquet_bytes:
          type: integer
          format: int64

    DatasetManifest:
      type: object
      description: |
        `manifest.json`, written beside a dataset's Parquet files. Not returned
        by any endpoint here: it is read straight from the object store by a
        viewer querying Parquet in the browser, and is what tells such a reader
        which tables exist.

        Without it the reader has no choice but to probe every table GTFS
        defines - 123 range requests for a seven-table feed - so publishing one
        is worth the trouble.

        Its sizes cannot be recovered after the fact: conversion deletes the
        CSVs, and an archive member's compressed size exists only in the
        archive's directory. Written last, after every Parquet file is in place,
        so a reader holding only the bucket URL is never told about a file that
        has not arrived.
      required: [version, tables]
      properties:
        version:
          type: integer
          description: >-
            `2` carries the sizes the load report shows. `1` carried only a table
            list, and meant something different by `bytes` - see `ManifestTable`.
          example: 2
        generated_at:
          type: string
          format: date-time
        gtfs_garage:
          type: string
          description: The version that wrote it.
          example: 1.4.2
        source:
          type: object
          required: [kind, bytes]
          properties:
            kind:
              type: string
              enum: [zip, folder, parquet]
            bytes:
              type: integer
              format: int64
        totals:
          type: object
          required: [uncompressed_bytes, stored_bytes]
          properties:
            uncompressed_bytes:
              type: integer
              format: int64
            stored_bytes:
              type: integer
              format: int64
        tables:
          type: array
          items:
            $ref: "#/components/schemas/ManifestTable"
