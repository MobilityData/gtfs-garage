name: Release

# A merge to main releases whichever package's version moved. The version in
# each package's own file is the source of truth, so the two release
# independently - a UI-only change does not republish the Python package.
#
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Is this version already on PyPI?
        id: check
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          version=$(python -c "import gtfs_garage; print(gtfs_garage.__version__)")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null "https://pypi.org/pypi/gtfs-garage/$version/json"; then
            echo "gtfs-garage $version is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the frontend
        if: steps.check.outputs.publish == 'true'
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: |
          pip install build
          python -m build

      - name: The wheel must contain the built frontend
        if: steps.check.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert "gtfs_garage/web/index.html" in names, f"frontend missing from {wheel}"
          assert any(n.endswith(".json") and "data/" in n for n in names), "schema missing"
          print(f"{wheel} contains the frontend and schema")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.check.outputs.publish == 'true'

  npm:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing
      id-token: write
    # registry-url makes setup-node write an .npmrc referring to
    # ${NODE_AUTH_TOKEN}, and yarn 1 refuses to run at all when that variable is
    # unset. setup-node v4 papered over this by exporting a dummy token; v7
    # exports nothing unless you supply one. Trusted publishing means we have no
    # token to supply, so define it as empty.
    env:
      NODE_AUTH_TOKEN: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Use an npm that can publish without a token
        run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: check
        working-directory: web
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name $version is already published; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the library
        if: steps.check.outputs.publish == 'true'
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build:lib

      # Every file the exports map names. A build that silently stopped
      # producing one would publish a package whose imports resolve to nothing.
      - name: The package must contain what it exports
        if: steps.check.outputs.publish == 'true'
        working-directory: web
        run: |
          for file in dist/mount.js dist/mount.d.ts \
                      dist/dataset.js dist/mount-dataset.d.ts \
                      dist/parquet.js dist/sources/parquet.d.ts \
                      dist/map.js dist/map-part.d.ts \
                      dist/react.js dist/react.d.ts \
                      dist/gtfs-garage-web.css; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
          done

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: web
        run: npm publish
