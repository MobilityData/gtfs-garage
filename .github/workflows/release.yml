name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import gtfs_garage; print(gtfs_garage.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match __version__ $version"
            exit 1
          fi

      - name: Build
        run: |
          pip install build
          python -m build

      - uses: pypa/gh-action-pypi-publish@release/v1
