name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: no API token stored in the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check the tag matches the package version
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import gtfs_garage; print(gtfs_garage.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match __version__ $version"
            exit 1
          fi

      # The frontend is not in version control, so the published wheel only has
      # an interface if it is built here first.
      - name: Build the frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build

      - name: Build
        run: |
          pip install build
          python -m build

      - name: The wheel must contain the built frontend
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert "gtfs_garage/web/index.html" in names, f"frontend missing from {wheel}"
          assert any(n.endswith(".json") and "data/" in n for n in names), "schema missing"
          print(f"{wheel} contains the frontend and schema")
          PY

      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing again, this time npm's: the registry verifies this
      # workflow's OIDC token instead of a stored NPM_TOKEN, and stamps the
      # package with provenance for it.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: web/yarn.lock
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Use an npm that can publish without a token
        run: npm install -g npm@latest

      - name: Check the tag matches the package version
        working-directory: web
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match web/package.json version $version"
            exit 1
          fi

      - name: Build the library
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build:lib

      # The exports map names four files; a build that silently stopped
      # producing one would publish a package nothing can import.
      - name: The package must contain what it exports
        working-directory: web
        run: |
          for file in dist/mount.js dist/mount.d.ts dist/map.js dist/map-part.d.ts \
                      dist/react.js dist/react.d.ts dist/gtfs-garage-web.css; do
            test -s "$file" || { echo "::error::$file is missing or empty"; exit 1; }
          done

      - name: Publish
        working-directory: web
        run: npm publish
