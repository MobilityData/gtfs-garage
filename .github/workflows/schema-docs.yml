name: Schema docs

on:
  push:
    branches: [main]
    paths:
      - "schema/**"
      - "docs/SCHEMA.md"
      - "scripts/build_schema_docs.py"
      - "scripts/build_schema_json.py"
      - "scripts/build-schema-site.sh"
      - ".github/workflows/schema-docs.yml"
  pull_request:
    paths:
      - "schema/**"
      - "docs/SCHEMA.md"
      - "scripts/build_schema_docs.py"
      - "scripts/build_schema_json.py"
  workflow_dispatch:

env:
  python_version: "3.11"

jobs:
  reference:
    name: The committed reference matches the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      # docs/SCHEMA.md is generated and committed so GitHub renders it, which
      # means it can go stale. Regenerating and comparing is what stops that.
      - name: Regenerate and compare
        run: |
          python scripts/build_schema_docs.py --out /tmp/SCHEMA.md
          if ! diff -q /tmp/SCHEMA.md docs/SCHEMA.md >/dev/null; then
            echo "::error::docs/SCHEMA.md is out of date. Run: python scripts/build_schema_docs.py"
            diff -u docs/SCHEMA.md /tmp/SCHEMA.md | head -40
            exit 1
          fi
          echo "docs/SCHEMA.md is current"

  publish:
    name: Publish the browsable site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      # Required by deploy-pages: it exchanges an OIDC token rather than a PAT.
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[schema]'
          pip install mkdocs mkdocs-material

      - name: Build
        run: scripts/build-schema-site.sh

      # enablement turns Pages on the first time, so this does not need a
      # manual visit to the repository settings before it can run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/schema-site/site

      - id: deploy
        uses: actions/deploy-pages@v4
