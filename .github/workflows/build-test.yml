name: Build and Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  python_version: "3.11"
  node_version: "22"

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}
          cache: pip
          cache-dependency-path: requirements_dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: scripts/lint-tests.sh

      - name: Test with coverage
        run: scripts/tests.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_reports/

  frontend:
    name: Typecheck and build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: yarn typecheck

      - name: Test
        working-directory: web
        run: yarn test

      - name: Build
        working-directory: web
        run: yarn build

  package:
    name: Build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      # The frontend is not in version control, so it has to be built before
      # packaging or the wheel would ship without an interface.
      - name: Build the frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Installing into a clean environment from a different directory is what
      # catches packaging mistakes: missing package data, or code that only
      # works when the current directory happens to be the repo root.
      - name: Install the wheel and run it from elsewhere
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/check/bin/gtfs-garage --version
          /tmp/check/bin/python -c "
          import gtfs_garage.core
          from gtfs_garage.server.app import web_root
          assert web_root().joinpath('index.html').is_file(), 'frontend missing from the wheel'
          from gtfs_garage.core.schema import FOREIGN_KEYS
          assert FOREIGN_KEYS, 'schema missing from the wheel'
          "

  performance:
    name: Map memory (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.node_version }}
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}

      # The guard drives the real interface, so the frontend has to exist.
      - name: Build the frontend
        working-directory: web
        run: yarn install --frozen-lockfile && yarn build

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,perf]"
          playwright install --with-deps chromium

      # Peak JS heap is the one thing no server-side test can see: it is what
      # killed a tab after a large feed had drawn and a table was opened.
      - name: Measure map memory
        run: python -m pytest -m browser -v

  # Benchmarks this branch and its base on the same runner, seconds apart, and
  # posts the difference. Same-runner matters: a baseline recorded on another
  # machine varies by more than most real regressions, so cross-run timings are
  # not worth reading. Reports only - the assertions that gate a merge live in
  # tests/test_performance_guards.py, which checks structure rather than duration.
  benchmark:
    name: Performance comparison
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit has to be reachable to be checked out below.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.python_version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Benchmark this branch
        run: python scripts/benchmark.py --json > /tmp/head.json

      # The harness has to be identical on both sides or the two runs are
      # different experiments: a branch that changes the generated feed or adds
      # a metric would otherwise be compared against numbers for another feed.
      # Only the library code under src/ is allowed to differ. The scripts are
      # kept in /tmp and run from there, because after the checkout below the
      # working tree is the base commit - where a script this branch adds does
      # not exist at all.
      - name: Benchmark the base commit
        continue-on-error: true
        run: |
          # Mirrors the repo layout: benchmark.py finds the feed generator at
          # ../tests/conftest.py relative to itself.
          mkdir -p /tmp/harness/scripts /tmp/harness/tests
          cp scripts/benchmark.py scripts/compare_benchmarks.py /tmp/harness/scripts/
          cp tests/conftest.py /tmp/harness/tests/
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          # The editable install points at src/, so the checkout above is what
          # this measures. No reinstall unless dependencies moved, in which case
          # this step fails and the report falls back to head-only.
          python /tmp/harness/scripts/benchmark.py --json > /tmp/base.json

      - name: Compare
        run: |
          python /tmp/harness/scripts/compare_benchmarks.py /tmp/base.json /tmp/head.json > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      # Best-effort: a pull request from a fork, and any Dependabot one, gets a
      # read-only token that `permissions` cannot elevate, so this step fails
      # there. The report is already in the job summary by now, so the numbers
      # survive either way. `pull_request_target` would fix commenting and is
      # deliberately not used: it runs with a writable token against a branch
      # the repository does not control.
      - name: Comment on the pull request
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/report.md', 'utf8');
            const marker = '<!-- gtfs-garage-benchmark -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Update in place rather than adding a comment per push.
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number });
            const mine = comments.find((c) => c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
