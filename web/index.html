<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GTFS Garage</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css" />
</head>
<body>
  <header>
    <h1>GTFS Garage</h1>
    <div id="source-label">No feed loaded</div>
    <!-- Filled in once a feed is loaded; expands into #metrics-panel. -->
    <button id="metrics-btn" title="What this feed cost to open" hidden></button>
    <button id="toggle-map-btn">Hide map</button>
    <button id="open-load-btn">Load feed</button>
  </header>

  <div id="metrics-panel" class="hidden">
    <div id="metrics-header">
      <strong>Load report</strong>
      <button id="metrics-close-btn" title="Close">&times;</button>
    </div>
    <div id="metrics-body"></div>
  </div>

  <div id="layout">
    <div id="sidebar"></div>
    <div id="content">
      <div id="table-pane">
        <div id="filter-bar">
          <button id="back-btn" title="Back to the previous view" disabled>&larr; Back</button>
          <button id="add-filter-btn">+ Filter</button>
        </div>
        <div id="add-filter-form">
          <select id="filter-column"></select>
          <select id="filter-op">
            <option value="eq">is</option>
            <option value="ne">is not</option>
            <option value="contains">contains</option>
            <option value="in">is one of (comma sep.)</option>
            <option value="is_empty">is empty</option>
            <option value="is_not_empty">is not empty</option>
          </select>
          <input id="filter-value" type="text" placeholder="value" />
          <select id="filter-value-picker" style="display:none"></select>
          <button id="filter-apply-btn" class="primary">Add</button>
          <button id="filter-cancel-btn">Cancel</button>
        </div>
        <div id="table-scroll">
          <div id="empty-state">Load a GTFS feed to start browsing.</div>
        </div>
        <div id="pager" style="display:none">
          <button id="prev-page">&laquo; Prev</button>
          <span id="page-info"></span>
          <button id="next-page">Next &raquo;</button>
          <span class="spacer"></span>
          <span id="row-count"></span>
        </div>
      </div>
      <div id="map-pane">
        <div id="map"></div>
        <!-- Filled in while a layer streams; hidden the rest of the time. -->
        <div id="map-progress" hidden></div>
      </div>
    </div>
  </div>

  <div id="load-overlay" class="hidden">
    <div id="load-panel">
      <h2>Load a GTFS feed</h2>
      <div id="dropzone">Drop a GTFS .zip here, or click to choose one</div>
      <input id="file-input" type="file" accept=".zip" style="display:none" />
      <!-- webkitdirectory turns this into a folder chooser. -->
      <input id="folder-input" type="file" webkitdirectory directory multiple style="display:none" />
      <div id="pick-row">
        <button id="pick-file-btn">Choose a .zip…</button>
        <button id="pick-folder-btn">Choose a folder…</button>
      </div>
      <div class="or">or</div>
      <label for="path-input" class="field-label">Local path or URL</label>
      <input
        id="path-input"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="/path/to/feed.zip, /path/to/extracted/folder, or https://example.org/gtfs.zip"
      />
      <div id="load-actions">
        <button id="load-path-btn" class="primary" disabled>Load</button>
        <button id="load-cancel-btn">Cancel</button>
      </div>
      <div id="load-status"></div>
      <div id="load-error"></div>
    </div>
  </div>

  <!-- MapLibre stays a CDN script for now; bundling it is a separate change. -->
  <script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
