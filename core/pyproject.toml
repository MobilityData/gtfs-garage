[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The framework-free half of GTFS Garage: loading, converting and querying a
# feed, with no web server. Released in lockstep with `gtfs-garage` (the
# repository root), which depends on this exact version.
[project]
name = "gtfs-garage-core"
description = "Load, convert to Parquet and query a GTFS feed with DuckDB. The library behind GTFS Garage."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MobilityData" }]
keywords = ["gtfs", "transit", "duckdb", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

# Only this, and tests/test_core_package.py keeps it that way: depending on the
# core must never pull in a web framework.
dependencies = [
    "duckdb~=1.5",
]

[project.urls]
Homepage = "https://github.com/MobilityData/gtfs-garage"
Repository = "https://github.com/MobilityData/gtfs-garage"
Issues = "https://github.com/MobilityData/gtfs-garage/issues"

[tool.hatch.version]
path = "src/gtfs_garage_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_garage_core"]

[tool.hatch.build.targets.sdist]
include = ["src/gtfs_garage_core", "README.md", "pyproject.toml"]
