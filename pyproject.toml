[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtfs-garage"
description = "Browse a GTFS feed locally: cross-referenced tables, filters and a map."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "MobilityData" }]
keywords = ["gtfs", "transit", "duckdb", "viewer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

dependencies = [
    "duckdb~=1.5",
    "fastapi~=0.141",
    "python-multipart~=0.0.32",
    "uvicorn~=0.52",
]

[project.optional-dependencies]
# Drives a real browser for the memory guard in tests/browser. Kept out of
# `dev` so the ordinary contributor setup does not pull a browser down.
perf = ["playwright~=1.49"]
# Validates schema/gtfs.yaml and regenerates the packaged schema document.
# Kept out of `dev` for the same reason as `perf`: LinkML pulls a large
# dependency tree, and only someone editing the schema needs it. The generated
# JSON is committed, so building and running the app never needs LinkML.
# mkdocs builds the browsable site in scripts/build-schema-site.sh. Declared
# here rather than named in an error message, so the script can install what it
# needs instead of telling you to.
schema = ["linkml~=1.9", "mkdocs~=1.6", "mkdocs-material~=9.5"]
# Only needed to query a feed from Python; the server extra adds the web UI.
dev = [
    "black==26.3.1",
    "coverage~=7.6",
    "flake8==6.0.0",
    "httpx~=0.28",
    "pre-commit==3.4.0",
    "pytest~=7.4.3",
    # scripts/build_schema_json.py reads the LinkML. Reading it needs only a
    # YAML parser; only validating it needs the much heavier `schema` extra.
    "pyyaml~=6.0",
]

[project.scripts]
gtfs-garage = "gtfs_garage.cli:main"

[project.urls]
Homepage = "https://github.com/MobilityData/gtfs-garage"
Repository = "https://github.com/MobilityData/gtfs-garage"
Issues = "https://github.com/MobilityData/gtfs-garage/issues"

[tool.hatch.version]
path = "src/gtfs_garage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtfs_garage"]
# The built frontend is gitignored, and hatchling excludes ignored files by
# default. `artifacts` is what puts generated files back in, so a wheel built
# after `yarn build` actually carries an interface.
artifacts = ["src/gtfs_garage/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/gtfs_garage", "tests", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/gtfs_garage/web/**"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# The browser guard needs a real Chromium and a built frontend, so it is opt-in:
# `pytest -m browser`. Everything else runs by default.
addopts = ["--import-mode=importlib", "-m", "not browser"]
markers = ["browser: drives a real browser; needs the perf extra and a built frontend"]
